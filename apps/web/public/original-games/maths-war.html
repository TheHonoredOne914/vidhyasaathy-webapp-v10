}

/* ---------- 1. NUMBER LINE ---------- */
LABS.numline=function(box,ctl,opts,api){
 box.innerHTML='';const s=makeSVG(700,150);box.appendChild(s);
 const X0=70,DX=56,XMAX=640,Y=78;
 s.appendChild(LN(X0-20,Y,XMAX+20,Y,{stroke:'#26243a','stroke-width':2.5}));
 for(let i=-5;i<=5;i++){const x=X0+(i+5)*DX;
  s.appendChild(LN(x,Y-6,x,Y+6,{stroke:'#26243a'}));
  s.appendChild(T(x,Y+22,String(i),{'font-size':12,fill:'#6d6a85'}));
 }
 const g=s.appendChild(NS('g',{}));
 const pin=CR(X0+2.5*DX,Y,9,{fill:'#f97316',stroke:'#c2410c','stroke-width':2.5,style:'cursor:grab;filter:drop-shadow(0 3px 6px rgba(249,115,22,.5))'});
 g.appendChild(pin);
 const pinlab=T(X0+2.5*DX,Y-24,'2.5',{'font-size':13,fill:'#c2410c'});
 g.appendChild(pinlab);
 let pinv=2.5;
 const setPin=v=>{pinv=clamp(v,-5,5);const x=X0+(pinv+5)*DX;pin.setAttribute('cx',x);pinlab.setAttribute('x',x);pinlab.textContent=fmt(pinv);api.touch()};
 makeDrag(s,pin,pt=>setPin((pt.x-X0)/DX-5));
 const special=[[Math.sqrt(2),'√2'],[Math.sqrt(3),'√3'],[Math.PI,'π'],[Math.sqrt(5),'√5'],[Math.sqrt(7),'√7']];
 const irrg=s.appendChild(NS('g',{}));
 special.forEach(([v,nm])=>{const x=X0+(v+5)*DX;if(x>XMAX)return;
  irrg.appendChild(NS('path',{d:'M '+x+' '+(Y-14)+' l 5 -9 l 5 9 z',fill:'#7c3aed'}));
  irrg.appendChild(T(x,Y-30,nm,{'font-size':10,fill:'#7c3aed'}));
 });
 irrg.style.opacity=0;
 const chips=document.createElement('div');chips.className='tabs';ctl.appendChild(chips);
 const fams=[['N Naturals',v=>v>=1&&Number.isInteger(v),'#059669'],
  ['W Wholes',v=>v>=0&&Number.isInteger(v),'#0284c7'],
  ['Z Integers',v=>Number.isInteger(v),'#7c3aed'],
  ['Q Rationals',v=>true,'#d97706'],
  ['Irrationals',v=>special.some(([sv])=>Math.abs(sv-v)<0.005),'#be185d'],
  ['R Reals',v=>true,'#3f3c58']];
 let marks=[];
 fams.forEach((f,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=f[0];
  b.addEventListener('click',()=>{chips.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');show(f);api.touch()});
  chips.appendChild(b)});
 function show(f){
  marks.forEach(m=>m.remove());marks=[];
  const pred=f[1],col=f[2];
  irrg.style.opacity=(f[0]==='Irrationals')?1:0.25;
  if(f[0]==='R Reals'){
   marks.push(RC(X0,Y-3,XMAX-X0,6,{fill:'url(#realg)',opacity:.9}));
   const defs=NS('linearGradient',{id:'realg',x1:0,y1:0,x2:1,y2:0});
   ['','#6366f1','#a855f7','#ec4899'].forEach((c,i)=>{if(c){const st=NS('stop',{offset:(i/3)*100+'%','stop-color':c});defs.appendChild(st)}});
   s.appendChild(defs);
   readout(ctl,'Every single point on this line is a <b>Real number</b> — rationals and irrationals together, no gaps.');
   return;
  }
  if(f[0]==='Q Rationals'){
   for(let v=-5;v<=5.01;v+=0.25){const x=X0+(v+5)*DX;marks.push(CR(x,Y,3.4,{fill:col}))}
   readout(ctl,'Rationals are <b>everywhere dense</b> — between any two dots there is always another dot. Yet they still leave room for √2, √3, π…');
   return;
  }
  for(let v=-5;v<=5;v++){if(pred(v)){const x=X0+(v+5)*DX;marks.push(CR(x,Y,7,{fill:col,opacity:.95}))}}
  readout(ctl,'<b>'+f[0].split(' ')[0]+'</b> highlighted. Now drag the orange pin onto one of these dots — or somewhere else entirely!');
 }
 const btwn=document.createElement('div');btwn.className='ctlrow';btwn.style.marginTop='6px';ctl.appendChild(btwn);
 const b1=addBtn(btwn,'🎯 Drop pin at a random irrational','btn-g',()=>{setPin(pick(special)[0]+R(-2,3));api.touch()});
 readout(ctl,'Tap a family chip above to see which numbers belong to it. Drag the orange pin anywhere!');
 if(opts.mode==='between'){
  let count=0;const dots=[];
  const info=readout(ctl,'Two pins are placed. Insert midpoints — the gaps NEVER run out!');
  const bctl=document.createElement('div');bctl.className='ctlrow';ctl.appendChild(bctl);
  addBtn(bctl,'➕ Insert midpoint','btn-p',()=>{
   count++;
   const v=(pinv)/2+((count%2)?-1:1)*0;
   const nv=pinv+(pinv>0?-1:1)*Math.pow(0.5,count+1);
   const x=X0+(nv+5)*DX;
   const d=CR(x,Y,5,{fill:'#059669',opacity:.9});
   s.appendChild(d);dots.push(d);
   info.innerHTML='Inserted <b>'+count+'</b> midpoint'+(count>1?'s':'')+' — still infinitely many left. Density in action!';
   SFX.step();api.touch();
  });
  addBtn(bctl,'🧹 Reset','btn-g',()=>{dots.forEach(d=>d.remove());dots.length=0;count=0;info.innerHTML='Reset. Insert midpoints again!'});
 }
 if(opts.mode==='decimal'){
  const bank=[['1/3','0.333333…',false],['1/7','0.142857142857…',true],['17/8','2.125',false],['2/9','0.222222…',false],['5/11','0.454545…',true]];
  let bi=0,revealed=0;
  const info=readout(ctl,'Pick a fraction, then reveal its decimal digits one by one.');
  const dctl=document.createElement('div');dctl.className='ctlrow';ctl.appendChild(dctl);
  const sel=document.createElement('div');sel.className='tabs';dctl.appendChild(sel);
  bank.forEach((b,i)=>{const tb=document.createElement('button');tb.className='tab'+(i===0?' on':'');tb.textContent=b[0];
   tb.addEventListener('click',()=>{sel.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));tb.classList.add('on');bi=i;revealed=0;info.innerHTML='Reveal the digits of <b>'+b[0]+'</b>…';api.touch()});
   sel.appendChild(tb)});
  addBtn(dctl,'🔢 Reveal next digit','btn-p',()=>{
   revealed++;
   const b=bank[bi];
   info.innerHTML='<b>'+b[0]+' = '+b[1]+'</b><br>'+(b[2]?'Repeating block! The denominator has a prime ≠ 2,5 → <b>non-terminating recurring</b>.':'The denominator is built from 2s and 5s → <b>terminating</b> decimal.');
   SFX.click();api.touch();
  });
 }
};

/* ---------- 2. ROOT SPIRAL ---------- */
LABS.spiral=function(box,ctl,opts,api){
 box.innerHTML='';const s=makeSVG(560,410);box.appendChild(s);
 const O={x:305,y:318},sc=92;
 const g=s.appendChild(NS('g',{}));
 const nlg=s.appendChild(NS('g',{}));
 s.appendChild(LN(30,375,540,375,{stroke:'#26243a','stroke-width':2.5}));
 for(let i=0;i<=5;i++){const x=30+i*100;s.appendChild(LN(x,370,x,380,{stroke:'#26243a'}));s.appendChild(T(x,395,String(i),{'font-size':11,fill:'#6d6a85'}))}
 let pts=[{x:1,y:0}];
 let k=1;
 const info=readout(ctl,'Build the Spiral of Theodorus: each new triangle adds an arm of length 1 → hypotenuse √(k+1).');
 const bctl=document.createElement('div');bctl.className='ctlrow';ctl.appendChild(bctl);
 const landings=[];
 addBtn(bctl,'➡️ Next triangle','btn-p',()=>{
  if(k>=7){info.innerHTML='Spiral complete up to <b>√7</b>! Notice: each hypotenuse = √(previous² + 1²).';return}
  const prev=pts[pts.length-1];
  const len=Math.hypot(prev.x,prev.y);
  const np={x:prev.x+(-prev.y/len),y:prev.y+(prev.x/len)};
  pts.push(np);k++;
  const p0={x:O.x,y:O.y},p1={x:O.x+prev.x*sc,y:O.y-prev.y*sc},p2={x:O.x+np.x*sc,y:O.y-np.y*sc};
  const poly=PT('M '+p0.x+' '+p0.y+' L '+p1.x+' '+p1.y+' L '+p2.x+' '+p2.y+' Z',{fill:'rgba(99,102,241,'+(0.10+k*0.05)+')',stroke:'#6366f1','stroke-width':2});
  g.appendChild(poly);
  g.appendChild(CR(p2.x,p2.y,4,{fill:'#e11d48'}));
  g.appendChild(T(p2.x+(p2.x>O.x?-26:26),p2.y,'√'+k,{'font-size':12,fill:'#be185d'}));
  const hyp=Math.hypot(np.x,np.y);
  if(k<=5){
   const lx=30+hyp*100;
   const arc=PT('M '+p2.x+' '+p2.y+' A '+hyp*100+' '+hyp*100+' 0 0 1 '+lx+' 375',{stroke:'#d97706','stroke-width':1.6,'stroke-dasharray':'5 4'});
   nlg.appendChild(arc);nlg.appendChild(CR(lx,375,5,{fill:'#d97706'}));
   nlg.appendChild(T(lx,362,'√'+k,{'font-size':11,fill:'#b45309'}));
   landings.push(lx);
  }
  info.innerHTML='Triangle '+k+': hypotenuse² = '+k+' → length <b>√'+k+'</b> ≈ '+fmt(Math.sqrt(k))+(k<=5?' — the arc drops it onto the number line at '+fmt(Math.sqrt(k))+'.':'');
  SFX.step();api.touch();
 });
 addBtn(bctl,'🧹 Clear spiral','btn-g',()=>{g.innerHTML='';nlg.innerHTML='';pts=[{x:1,y:0}];k=1;info.innerHTML='Spiral cleared. Build it again!'});
};

/* ---------- 3. EXPONENTS & RATIONALISE ---------- */
LABS.expo=function(box,ctl,opts,api){
 box.innerHTML='';const s=makeSVG(520,240);box.appendChild(s);
 let a=2,n=3;
 const bars=s.appendChild(NS('g',{}));
 const draw=()=>{
  bars.innerHTML='';
  const vals=[];let v=1;
  for(let i=1;i<=n;i++){v*=a;vals.push(v)}
  const maxv=Math.min(vals[vals.length-1],220);
  const H=150,base=200;
  vals.forEach((val,i)=>{
   const h=Math.max(8,val/maxv*H);
   bars.appendChild(RC(50+i*70,base-h,34,h,{rx:6,fill:'url(#expgrad)'}));
   bars.appendChild(T(67,base-h-8,fmt(Math.min(val,1e6)),{'font-size':12,fill:'#4338ca'}));
   bars.appendChild(T(67,base+16,'a^'+(i+1),{'font-size':11,fill:'#6d6a85'}));
  });
  readout(ctl,'Laws firing: <b>aᵐ·aⁿ = aᵐ⁺ⁿ</b> → each step multiplies by '+a+'. So '+a+'<sup>'+n+'</sup> = '+fmt(Math.pow(a,n))+'. Also (aᵐ)ⁿ = aᵐ·ⁿ: slide and verify!');
 };
 const defs=NS('linearGradient',{id:'expgrad',x1:0,y1:1,x2:0,y2:0});
 defs.appendChild(NS('stop',{offset:'0%','stop-color':'#818cf8'}));defs.appendChild(NS('stop',{offset:'100%','stop-color':'#4f46e5'}));
 s.appendChild(defs);
 addSlider(ctl,'Base a',1,6,a,1,v=>{a=v;draw()});
 addSlider(ctl,'Power n',1,6,n,1,v=>{n=v;draw()});
 draw();
 const rctl=document.createElement('div');rctl.className='ctlrow';ctl.appendChild(rctl);
 const info=readout(ctl,'');
 addTabs(rctl,['Laws of powers','Rationalise 1/√n','Conjugate 1/(√7−2)'],0,i=>{
  const r=readout(ctl,'');
  if(i===0)r.innerHTML='Slide a and n: aᵐ·aⁿ = aᵐ⁺ⁿ · aᵐ/aⁿ = aᵐ⁻ⁿ · (aᵐ)ⁿ = aᵐⁿ · a⁻ⁿ = 1/aⁿ · a^(1/2) = √a';
  if(i===1)r.innerHTML='Pick a surd below: watch the surd move upstairs. <span id="rsurds"></span>';
  if(i===2)r.innerHTML='1/(√7 − 2): multiply by (√7 + 2)/(√7 + 2). Denominator: (√7−2)(√7+2) = 7 − 4 = <b>3</b>. Result: <b>(√7 + 2)/3</b>. The difference-of-squares kills the surd!';
  if(i===1){
   const sd=r.querySelector('#rsurds')||r;
   const bctl2=document.createElement('div');bctl2.className='ctlrow';ctl.appendChild(bctl2);bctl2.id='rbtns';
   const old=ctl.querySelectorAll('#rbtns');old.forEach(x=>x.remove());
   const bc=document.createElement('div');bc.className='ctlrow';bc.id='rbtns';ctl.appendChild(bc);
   [2,3,5,7,10].forEach(nn=>{
    addBtn(bc,'1/√'+nn,'btn-s',()=>{readout(ctl,'Multiply top & bottom by √'+nn+': (1·√'+nn+')/(√'+nn+'·√'+nn+') = <b>√'+nn+'/'+nn+'</b> — surd upstairs, clean integer downstairs!');api.touch()});
   });
  }
  api.touch();
 });
};

/* ---------- 4. POLYNOMIAL BUILDER (degree) ---------- */
LABS.degree=function(box,ctl,opts,api){
 box.innerHTML='';const s=makeSVG(560,200);box.appendChild(s);
 const exprT=T(280,70,'',{'font-size':26,'font-weight':800,fill:'#26243a','font-family':'Outfit'});
 const degT=T(280,120,'',{'font-size':17,fill:'#4338ca','font-family':'Outfit'});
 const badge=RC(200,145,160,34,{rx:17,fill:'#f1eef8'});
 const badgeT=T(280,168,'',{'font-size':14,'font-weight':800,fill:'#4338ca','font-family':'Outfit'});
 s.appendChild(badge);s.appendChild(exprT);s.appendChild(degT);s.appendChild(badgeT);
 const terms=[{k:'x³',p:3,ok:true},{k:'x²',p:2,ok:true},{k:'x',p:1,ok:true},{k:'7',p:0,ok:true},{k:'√x',p:0.5,ok:false},{k:'1/x',p:-1,ok:false}];
 const state={};
 const chips=document.createElement('div');chips.className='tabs';ctl.appendChild(chips);
 function upd(){
  const on=terms.filter(t=>state[t.k]);
  if(!on.length){exprT.textContent='0';degT.textContent='(turn some terms on)';badgeT.textContent='—';return}
  const bad=on.filter(t=>!t.ok);
  const expr=on.map(t=>t.k).join(' + ').replace(/\+ −/g,'− ');
  exprT.textContent=on.length>1?on.map(t=>t.k).join(' + '):on[0].k;
  if(bad.length){
   degT.textContent='Not a polynomial — '+bad[0].k+' has a fractional/negative power!';
   badge.setAttribute('fill','#fef2f2');badgeT.textContent='🚫 NOT A POLYNOMIAL';badgeT.setAttribute('fill','#dc2626');
  }else{
   const deg=Math.max(...on.map(t=>t.p));
   degT.textContent='Highest power = '+deg+' → degree '+deg;
   badge.setAttribute('fill','#ecfdf5');
   badgeT.textContent=deg===0?'CONSTANT':deg===1?'LINEAR':deg===2?'QUADRATIC':'CUBIC';
   badgeT.setAttribute('fill','#047857');
  }
 }
 terms.forEach(t=>{
  const b=document.createElement('button');b.className='tab';b.textContent=t.k;
  b.addEventListener('click',()=>{state[t.k]=!state[t.k];b.classList.toggle('on',!!state[t.k]);upd();api.touch();SFX.click()});
  chips.appendChild(b);
 });
 upd();
 readout(ctl,'Build a polynomial by toggling terms. Watch the degree = highest whole-number power — and the alarm when √x or 1/x sneaks in!');
};

/* ---------- 5. POLYGRAPH ---------- */
LABS.polygraph=function(box,ctl,opts,api){
 box.innerHTML='';const s=makeSVG(460,340);box.appendChild(s);
 const U=30,CX=230,CY=170;
 for(let i=-7;i<=7;i++){s.appendChild(LN(CX+i*U,10,CX+i*U,330,{stroke:'#e9e5f0'}))}
 for(let j=-5;j<=5;j++){s.appendChild(LN(30,CY+j*U,430,CY+j*U,{stroke:'#e9e5f0'}))}

/* ---------- 7. REMAINDER / FACTOR MACHINE ---------- */
LABS.remt=function(box,ctl,opts,api){
 box.innerHTML='';const s=makeSVG(520,250);box.appendChild(s);
 const factor=opts.mode==='factor';
 const CO=factor?[1,-4,1,6]:[1,-3,4,-4];
 const pstr=factor?'x³ − 4x² + x + 6':'x³ − 3x² + 4x − 4';
 const pxT=T(260,26,'p(x) = '+pstr,{'font-size':16,'font-weight':800,fill:'#312e81','font-family':'Outfit'});
 s.appendChild(pxT);
 let k=1;
 const found=[];
 const barT=T(130,180,'p(k)',{'font-size':13,fill:'#4338ca','font-family':'Outfit'});
 const barR=T(390,180,'remainder',{'font-size':13,fill:'#b45309','font-family':'Outfit'});
 s.appendChild(barT);s.appendChild(barR);
 const draw=()=>{
  const val=CO[0]*k*k*k+CO[1]*k*k+CO[2]*k+CO[3];
  const hT=clamp(Math.abs(val)*9,6,70);
  s.querySelectorAll('.bar').forEach(x=>x.remove());
  const bar1=RC(95,175-hT,70,hT,{rx:6,fill:val===0?'#10b981':'url(#expgrad)',class:'bar'});
  const bar2=RC(355,175-hT,70,hT,{rx:6,fill:val===0?'#10b981':'rgba(217,119,6,.75)',class:'bar'});
  s.appendChild(bar1);s.appendChild(bar2);
  s.appendChild(T(130,175-hT-8,String(val),{'font-size':15,'font-weight':800,fill:'#4338ca','font-family':'Outfit',class:'bar'}));
  s.appendChild(T(390,175-hT-8,String(val),{'font-size':15,'font-weight':800,fill:'#b45309','font-family':'Outfit',class:'bar'}));
  if(factor){
   if(val===0&&!found.includes(k)){found.push(k);SFX.ok();burst(24)}
   const chips=found.map(r=>r>0?'(x − '+r+')':r===0?'x':'(x + '+(-r)+')').join(' × ');
   readout(ctl,'p('+k+') = '+val+(val===0?' ✦ FACTOR FOUND: (x − '+k+') — collected '+found.length+'/3. '+chips:' — not zero, keep hunting (try small integers!).'));
   if(found.length===3){readout(ctl,'🏆 Complete: '+pstr+' = (x+1)(x−2)(x−3). All three integer roots found!');burst(60);SFX.win()}
  }else{
   readout(ctl,'Dividing by (x − '+k+') → remainder = p('+k+') = <b>'+val+'</b>.'+(val===0?' Remainder 0 → (x − '+k+') is a FACTOR!':' No long division needed — one substitution.'));
  }
  api.touch();
 };
 if(factor){readout(ctl,'Hunt for integer roots: slide k until the bars turn GREEN (p(k) = 0). Collect all three factors!')}
 else{readout(ctl,'Slide k — the two bars NEVER disagree. That is the Remainder Theorem: remainder = p(k).')}
 addSlider(ctl,'k in (x − k)',-3,3,k,1,v=>{k=v;draw()});
 draw();
};

 for(let j=-4;j<=4;j+=2){if(j)s.appendChild(T(CX-11,CY-j*U+4,String(j),{'font-size':9,fill:'#6d6a85'}))}

   g.appendChild(T(cx+4,base-H/2,'h='+h,{'font-size':11,fill:'#3f3c58'}));

   g.appendChild(T(cx,base+30,'r = '+r,{'font-size':12,fill:'#0f766e','font-weight':800}));
   if(unroll){

    g.appendChild(T(cx+330,140,'O',{'font-size':12,fill:'#0e7490'}));
    g.appendChild(T(cx+330,258,'unrolled: sector radius l = '+fmt(l)+', arc = 2πr = '+fmt(2*PV()*r)+pnote(),{'font-size':11,fill:'#0e7490'}));
   }
   info.innerHTML='l² = r² + h² → l = '+fmt(l)+' · CSA = πrl = '+fmt(PV()*r*l)+pnote()+' · TSA = πr(l+r) = '+fmt(PV()*r*(l+r))+pnote()+' · V = ⅓πr²h = '+fmt(PV()*r*r*h/3)+pnote()+' · 3 cones fill 1 cylinder!';

    g.appendChild(T(280,yy,tally,{'font-size':14,fill:'#0f766e'}));

   });
   const mi=freqs.indexOf(Math.max(...freqs));

  }
  if(mode==='averages'){
   const sorted=[...data].sort((x,y)=>x-y);
   const mean=data.reduce((a,b)=>a+b,0)/data.length;
   const n=sorted.length;
   const med=n%2?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;
   const cnt={};let mode2v=null,mc=0;
   data.forEach(v=>{cnt[v]=(cnt[v]||0)+1;if(cnt[v]>mc){mc=cnt[v];mode2v=v}});

   });

   +'<path d="M 74 116 h 52" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>'
   +'<path d="M 20 100 l -12 -8 l 4 16 Z" fill="#334155"/><path d="M 180 100 l 12 -8 l -4 16 Z" fill="#334155"/>';

 }

/* ---------- strand map + levels ---------- */
const STRAND_MAP={num:'arith',poly:'alg',grid:'geo',line:'alg',euc:'geo',ang:'geo',tri:'geo',quad:'geo',circ:'geo',area:'geo',sol:'geo',dat:'dat',prob:'dat',seq:'alg'};

/* ---------- the 12 basics questions ---------- */
const DIAG_QS=[
 {s:'arith',q:'3/4 + 1/4 = ?',opts:['1','1/2','1/8','3/8'],a:0,why:'Same denominators? Add the tops only: 3+1 = 4, so 4/4 = 1. Denominator (bottom) batata hai piece ka size — same size ke pieces hi seedha add hote hain.'},
 {s:'arith',q:'(−7) + 12 = ?',opts:['5','−5','19','−19'],a:0,why:'Number line pe −7 se 12 steps aage jao → 5. Bada sign winner ka: 12 positive hai aur bada, so answer positive 5.'},
 {s:'arith',q:'25% of 80 = ?',opts:['20','25','40','8'],a:0,why:'25% = 1/4 (quarter). 80 ke 4 hisse → 80 ÷ 4 = 20. Percentage matlab "per hundred" — 25/100 × 80 = 20.'},
 {s:'alg',q:'Simplify: 5x + 3x',opts:['8x','15x','8x²','5x³'],a:0,why:'5 apples + 3 apples = 8 apples. 5 x + 3 x = 8 x. Same cheez (x) ke counts juddte hain — powers multiply NAHI hote yahan.'},
 {s:'alg',q:'Solve: 2x = 14',opts:['x = 7','x = 12','x = 16','x = 28'],a:0,why:'Equation ek balance hai. x ko akela karne ke liye dono sides ko 2 se divide karo: 14 ÷ 2 = 7. Jo ek side pe karo, doosri side pe bhi — tabhi balance rehta hai.'},
 {s:'alg',q:'3² × 3¹ = ?',opts:['27','9','81','6'],a:0,why:'Same base — powers ADD hoti hain: 2+1 = 3, so 3³ = 27. (Agar multiply karke 9 socha toh dhyan se: 3²×3¹ means 9×3.)'},
 {s:'geo',q:'A triangle ke teeno angles ka sum = ?',opts:['180°','360°','90°','270°'],a:0,why:'Har triangle ka golden rule: teeno angles milke hamesha exactly 180° dete hain. Do angles pata ho toh teesra = 180 − (dono ka sum).'},
 {s:'geo',q:'Area of a 5 cm × 3 cm rectangle = ?',opts:['15 cm²','8 cm²','16 cm²','10 cm²'],a:0,why:'Rectangle ka area = length × breadth = 5 × 3 = 15 square cm. Area matlab andar ka surface kitni "unit squares" bharta hai.'},
 {s:'geo',q:'Point (3, −2) kis quadrant me baithta hai?',opts:['IV (x+, y−)','I (x+, y+)','II (x−, y+)','III (x−, y−)'],a:0,why:'x = 3 positive (right side), y = −2 negative (neeche). Right + neeche = Quadrant IV. Order yaad rakho: pehle x ki baari (chalein "x pehle, phir y").'},
 {s:'dat',q:'4, 8, 12 ka mean = ?',opts:['8','12','6','10'],a:0,why:'Mean = sab jodo, count se baanto: (4+8+12) ÷ 3 = 24 ÷ 3 = 8. Mean is the "equal-share" value — sabko barabar baanto toh har ko kya milta hai.'},
 {s:'dat',q:'2, 3, 3, 5, 7 ka mode = ?',opts:['3','4','5','7'],a:0,why:'Mode = sabse popular value (jo sabse zyada baar aaye). Yahan 3 do baar aaya, baaki sab ek baar → mode = 3. MOst Ontinuous = MOde!'},
 {s:'dat',q:'Ek fair coin me heads aane ka probability = ?',opts:['1/2','1','0','1/4'],a:0,why:'2 barabar outcomes (heads, tails) me se 1 favourable. P = favourable/total = 1/2. Probability hamesha 0 aur 1 ke beech rehti hai.'}
];

 alg:{t:'Algebra refresher — x ke saath dosti',li:['<b>Like terms:</b> 5x+3x = 8x (same cheez count karo). 5x+3x² ko aage nahi badh sakte.','<b>Balance rule:</b> equation dono taraf barabar — jo ek side pe karo, doosri pe bhi.','<b>Solve 2x=14:</b> dono sides ÷ 2 → x=7. Solve x+3=9: dono sides − 3 → x=6.','<b>Powers:</b> x² means x·x. aᵐ·aⁿ = aᵐ⁺ⁿ (same base → powers add).']},

};

 +'<div class="opts">'+q.opts.map((o,k)=>'<button class="opt" style="animation-delay:'+(0.06+k*0.06)+'s" onclick="A.diagAns('+k+')"><span class="opt-l">'+'ABCD'[k]+'</span><span>'+o+'</span></button>').join('')+'</div>'
 +'<div id="dwhy"></div></div></div>';

 return '<div class="dres"><span class="dq-kick">🧭 WARRIOR REPORT READY</span><h2>Ab hum jaante hain: kahan se shuru karna hai</h2>'

 +weakStrands().map(s=>'<div class="dadv"><b>'+names[s]+' booster ON:</b> '+advice[s]+'</div>').join('')
 +(weakStrands().length===0?'<div class="dadv"><b>Ground strong hai!</b> Seedha koi bhi world chuno — sab unlocked hai. Bosses se darna mana hai.</div>':'')
 +'<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap"><button class="btn btn-p btn-xl" onclick="A.diagGo()">⚔️ Arena me enter karo</button><button class="btn btn-g" onclick="A.diagRetake()">↻ Retake</button></div></div>';
}
window.A_EXTRA=Object.assign({},window.A_EXTRA,{
 diagStart(){DSTATE={phase:'test',i:0,ans:[]};go('diag');SFX.click()},
 diagSkip(){DSTATE=null;go('home')},
 diagAns(k){
  if(!DSTATE||DSTATE.phase!=='test')return;
  const q=DIAG_QS[DSTATE.i],ok=k===q.a;
  DSTATE.ans.push({s:q.s,ok});

 },

   renderDiag();scrollTo(0,0);
  }else renderDiag();
 },

<script>
'use strict';
/* ============================================================
   BOOK ZONE DATA · part 1 — Grid Guardians (Book Ch 1: Coordinates)
   Ganita Manjari Grade 9 · real exercise questions, solved
   step-by-step with Hinglish + English Ask explanations.
   ============================================================ */
window.BOOKZ=window.BOOKZ||{};
BOOKZ.grid={
 src:'Ganita Manjari · Grade 9 · Part I — Book Ch 1 (Orienting Yourself: The Use of Coordinates)',
 sets:[
 {set:'End-of-Chapter Exercises',qs:[
  {q:'What are the x-coordinate and y-coordinate of the point of intersection of the two axes?',
   why:'GPS, chess boards, game maps — sab ka "zero point" yahi concept hai. Axes ka intersection hi poore system ka address 0 hai.',
   steps:[
    ['The two axes are the x-axis and the y-axis.','x-axis horizontal line hai, y-axis vertical — dono ek dusre ko jahan kaatte hain, wahi intersection point hai.','The x-axis (horizontal) and the y-axis (vertical) cross each other at exactly one point — that point is their intersection.'],
    ['That intersection point is called the origin.','Is point ka naam hai origin. Poore plane ka "home base" yahi hai — sab measurements yahi se count hoti hain.','This crossing point has a name: the origin. Every measurement in the plane starts counting from here.'],
    ['At the origin, distance from BOTH axes is 0','Origin se x-axis ki doori = 0, aur y-axis ki doori bhi = 0. x-coordinate y-axis se doori hai, y-coordinate x-axis se — dono 0.','At the origin, the distance from the y-axis is 0 (so x = 0) and the distance from the x-axis is also 0 (so y = 0).'],
    ['Answer: (0, 0)','Toh intersection point ke coordinates = (0, 0). Isi point ko O bhi likhte hain.','So the coordinates of the intersection are (0, 0) — the origin O.']],
   ans:'(0, 0) — the origin'},
  {q:'Point W has x-coordinate equal to −5. Can you predict the coordinates of point H which is on the line through W parallel to the y-axis? Which quadrants can H lie in?',
   why:'Metro lines socho: ek hi vertical line pe saare stations ka "east-west address" same hota hai. Yahi idea yahan chal raha hai.',
   steps:[
    ['A line parallel to the y-axis keeps x fixed','y-axis ke parallel line pe chalne wala HAR point utna hi door rehta hai y-axis se jitna W hai. y-axis se doori = x-coordinate. W ka x = −5, toh is poori line ka x = −5 hi rahega.','Every point on a line parallel to the y-axis stays the same distance from the y-axis. That distance IS the x-coordinate, so every such point has x = −5.'],
    ['So H = (−5, y) for some value of y','H usi line pe hai, isliye H = (−5, y) — y kuch bhi ho sakta hai. Sirf x pakka −5, y free.','So H must look like (−5, y) — the first number is locked at −5, while y can be anything.'],
    ['Sign of x is negative → left half of the plane','x = −5 negative hai matlab H y-axis ke LEFT side pe hai. Ab sirf y ka sign decide karega quadrant.','Because x = −5 is negative, H lives to the LEFT of the y-axis. Only the sign of y decides which quadrant.'],
    ['y > 0 → Quadrant II; y < 0 → Quadrant III','Agar y positive (upar) → Quadrant II. Agar y negative (neeche) → Quadrant III. (Aur agar y = 0 toh H bilkul x-axis pe baith jayega.)','If y > 0, H is in Quadrant II; if y < 0, in Quadrant III. If y = 0, H sits exactly on the x-axis.']],
   ans:'H = (−5, y); H can lie in Quadrant II (y > 0) or Quadrant III (y < 0)'},
  {q:'Consider the points R(3, 0), A(0, −2), M(−5, −2) and P(−5, 2), joined in the order R→A→M→P→R. Predict: (i) two sides perpendicular to each other, (ii) one side parallel to an axis, (iii) two points that are mirror images in one axis.',
   why:'Floor-plan drawing yehi hai: deewar seedhi hai (axis-parallel) ya corner right-angle hai — coordinates se predict karo, phir plot karke verify.',
   steps:[
    ['Compare coordinates pair by pair','Side RA: R(3,0)→A(0,−2). Side AM: A(0,−2)→M(−5,−2). Side MP: M(−5,−2)→P(−5,2). Side PR: P(−5,2)→R(3,0). Har side ke dono points ke x aur y alag-alag dekho.','Look at each side and compare the two endpoints: if y stays the same the side is horizontal; if x stays the same it is vertical.'],
    ['AM is horizontal (both y = −2), MP is vertical (both x = −5)','A aur M dono ka y = −2 → AM x-axis ke parallel seedhi line. M aur P dono ka x = −5 → MP y-axis ke parallel. Horizontal ⊥ vertical hota hai → AM aur MP perpendicular hain (right angle at M).','A(0,−2) and M(−5,−2) share y = −2, so AM is horizontal. M(−5,−2) and P(−5,2) share x = −5, so MP is vertical. Horizontal meets vertical at 90°, so AM ⊥ MP — (i) and (ii) both solved.'],
    ['Perpendicular sides: AM and MP; axis-parallel side: AM (∥ x-axis) or MP (∥ y-axis)','(i) AM ⊥ MP. (ii) AM x-axis ke parallel (ya MP y-axis ke parallel).','(i) AM and MP are perpendicular. (ii) AM is parallel to the x-axis (MP to the y-axis).'],
    ['Mirror test: flip the sign of y → reflection in the x-axis','x-axis me mirror image = y ka sign flip. M(−5,−2) → (−5, +2) = P milta hai! Toh M aur P ek dusre ke mirror images hain x-axis me. (iii) answer: M & P, axis = x-axis.','Reflecting in the x-axis changes the sign of y only. M(−5,−2) becomes (−5, 2), which is exactly P. So M and P are mirror images in the x-axis.'],
    ['Plot and verify','Ab charo points plot karo: RAMP ek tilted quadrilateral banta hai jiska corner M perfect right angle hai — prediction sahi!','Plot the four points: you get a quadrilateral with a perfect right angle at M — exactly as predicted.']],
   ans:'(i) AM ⊥ MP (right angle at M) · (ii) AM ∥ x-axis (MP ∥ y-axis) · (iii) M and P are mirror images in the x-axis'},
  {q:'In the triangle with A(3, 4), D(7, 1) and M(9, 6), find the lengths of the three sides AD, DM and MA (use the Baudhāyana–Pythagoras method).',
   why:'Kabhi kabhi Google Maps "crow-fly distance" deta hai — wo yahi formula hai. Baudhayana ne yeh 800+ saal pehle Pythagoras se pehle likha tha!',
   steps:[
    ['Shift along x: 7 − 3 = 4, shift along y: 1 − 4 = −3','A se D jaane ke liye x me 4 kadam aage, y me 3 kadam neeche. Ye dono shift ek right triangle ke legs banate hain, AD hypotenuse hai.','Moving from A to D: 4 units across and 3 units down. These shifts are the two legs of a right triangle whose hypotenuse is AD.'],
    ['AD = √(4² + 3²) = √(16 + 9) = √25 = 5','Baudhāyana–Pythagoras: legs ka square jodo, root lo. 4²+3² = 25, √25 = 5. AD = 5 units.','By the theorem: AD = √(4² + 3²) = √25 = 5 units. (Remember: sign of the shift does not matter because we square it.)'],
    ['DM: shifts are 9−7 = 2 and 6−1 = 5 → DM = √(2² + 5²) = √29','D se M: x me 2, y me 5. 4+25 = 29. 29 kisi perfect square ka root nahi → DM = √29 (≈5.39).','From D to M: 2 across, 5 up → DM = √(4 + 25) = √29 units, an irrational number.'],
    ['MA: shifts are 9−3 = 6 and 6−4 = 2 → MA = √(6² + 2²) = √40 = 2√10','M se A: x me 6, y me 2. 36+4 = 40. √40 = √(4×10) = 2√10 (≈6.32).','From M to A: 6 across, 2 up → MA = √40 = 2√10 units.']],
   ans:'AD = 5 · DM = √29 · MA = 2√10 (all in units)'},
  {q:'For each row of the table, state whether M is the midpoint of ST — S(−3,0), M(0,0), T(3,0); S(2,3), M(3,4), T(4,5); S(0,0), M(0,5), T(0,−10); S(−8,7), M(0,−2), T(6,−3). Then find the connection between the coordinates of M, S and T.',
   why:'Middle seat, halfway point, "tum dono ke beech me" — midpoint har jagah hai. Iska formula ab test karke khud discover karoge.',
   steps:[
    ['Row 1: S(−3,0), T(3,0) — M(0,0) is exactly halfway','SM = |0−(−3)| = 3, MT = |3−0| = 3. Barabar doori, aur M S aur T ke BEECH me hai → Yes, midpoint.','SM = 3 and MT = 3, and M lies between S and T → Yes, M is the midpoint.'],
    ['Row 2: S(2,3), T(4,5) — M(3,4) is halfway in BOTH x and y','SM = √(1²+1²)=√2, MT = √(1²+1²)=√2, equal → Yes. Dhyan do: x me 2→3→4 (steps of 1), y me 3→4→5 (steps of 1).','SM = MT = √2 and M sits between S and T → Yes. Notice x climbs 2→3→4 and y climbs 3→4→5 in equal steps.'],
    ['Row 3: S(0,0), T(0,−10) — M(0,5) is NOT between them','SM = 5, MT = |−10−5| = 15. Unequal, aur M T ke beech bhi nahi (T neeche hai, M upar) → No.','SM = 5 but MT = 15, and M is not between S and T → No, not the midpoint.'],
    ['Row 4: S(−8,7), T(6,−3) — check M(0,−2)','True midpoint would be: x = (−8+6)/2 = −1, y = (7−3)/2 = 2 → (−1, 2) ≠ (0,−2) → No. (SM = √(64+81)=√145, MT = √(36+1)=√37 — unequal too.)','The real midpoint of S and T is (−1, 2), not (0, −2) → No.'],
    ['The connection: M = ((x_S + x_T)/2, (y_S + y_T)/2)','Midpoint = dono coordinates ka AVERAGE. Ye row 1, 2 pe verify karo: (−3+3)/2 = 0 ✓, (2+4)/2 = 3 ✓. Ye formula ab hamesha kaam karega.','The midpoint takes the AVERAGE of the x-coordinates and the average of the y-coordinates: M = ((x₁+x₂)/2, (y₁+y₂)/2).']],
   ans:'Yes, Yes, No, No — and M = ((x_S+x_T)/2, (y_S+y_T)/2)'},
  {q:'Use the midpoint connection: find B(x, y) given that M(−7, 1) is the midpoint of A(3, −4) and B.',
   why:'Ulta question! End point aur mid point pata hai — dusra end point dhundo. Ye "reverse engineering" exam me bahut aati hai.',
   steps:[
    ['Write the midpoint equations with the unknown B(x, y)','Midpoint formula ulta lagao: (3 + x)/2 = −7 (x wali equation) aur (−4 + y)/2 = 1 (y wali equation). Do simple equations ban gayi.','Apply M = ((x_A + x_B)/2, (y_A + y_B)/2) with B unknown: (3+x)/2 = −7 and (−4+y)/2 = 1.'],
    ['Solve the x equation: 3 + x = −14 → x = −17','Dono sides × 2: 3 + x = −14. Dono sides − 3: x = −17.','Multiply both sides by 2: 3 + x = −14, then subtract 3: x = −17.'],
    ['Solve the y equation: −4 + y = 2 → y = 6','Dono sides × 2: −4 + y = 2. Dono sides + 4: y = 6.','Multiply by 2: −4 + y = 2, then add 4: y = 6.'],
    ['B = (−17, 6) — check it!','Verify: midpoint of A(3,−4) aur B(−17,6) = ((3−17)/2, (−4+6)/2) = (−14/2, 2/2) = (−7, 1) ✓ = M.','Check: ((3 + (−17))/2, ((−4) + 6)/2) = (−7, 1) = M ✓']],
   ans:'B = (−17, 6)'},
  {q:'Show that A(1, −8), B(−4, 7) and C(−7, −4) lie on a circle K whose centre is the origin O(0, 0). Find the radius of K. Then check whether D(−5, 6) and E(0, 9) lie within, on, or outside circle K.',
   why:'"Same centre se same doori" — yehi circle ki definition hai. Oyo rooms, cell towers coverage — sab "radius ke andar hai ya nahi" wala sawaal hai.',
   steps:[
    ['Circle rule: every point on it is the SAME distance from the centre','Circle ki definition: centre O ho toh circle pe har point ki OA-type doori = radius, sab points ke liye SAME. Toh check karna hai: OA, OB, OC barabar hain?','A circle with centre O is the set of all points at one fixed distance (the radius) from O. So we must show OA = OB = OC.'],
    ['OA = √(1² + (−8)²) = √65','A(1,−8): x me 1, y me 8 shift. 1 + 64 = 65.','OA = √(1² + 8²) = √65.'],
    ['OB = √((−4)² + 7²) = √65 and OC = √((−7)² + (−4)²) = √65','B(−4,7): 16 + 49 = 65. C(−7,−4): 49 + 16 = 65. Teeno √65! Sab centre se utni hi door → teeno circle K pe hain, radius = √65.','OB = √(16 + 49) = √65 and OC = √(49 + 16) = √65. All three distances are equal, so A, B, C all lie on circle K, and the radius is √65.'],
    ['D(−5, 6): OD = √(25 + 36) = √61 < √65 → INSIDE','√61 chhota hai √65 se (61 < 65), matlab D centre se thoda zyada paas hai → D circle ke ANDAR.','OD = √61 and 61 < 65, so D is closer to O than the radius → D lies inside K.'],
    ['E(0, 9): OE = √(0 + 81) = 9, and 9² = 81 > 65 → OUTSIDE','√65 ≈ 8.06 aur 9 > 8.06 → E centre se zyada door → E circle ke BAHAR.','OE = 9 ≈ 9.00 > √65 ≈ 8.06, so E lies outside K.']],
   ans:'Radius = √65 · D is inside K · E is outside K'},
  {q:'A screen is 800 × 600 pixels with the origin at the bottom-left. Icon A: centre (100, 150), radius 80. Icon B: centre (250, 230), radius 100. (i) Does any part of either circle go outside the screen? (ii) Do the two circles intersect?',
   why:'Game/app UI me icons overlap hote hain ya screen se bahar nikal jaate hain — programmer EXACT yehi check karta hai. Real coding question!',
   steps:[
    ['Circle A extremes: x from 20 to 180, y from 70 to 230','Leftmost point = 100 − 80 = 20, rightmost = 100 + 80 = 180, bottom = 150 − 80 = 70, top = 150 + 80 = 230. Screen 0→800 (x), 0→600 (y) me sab fit → A poora andar.','Circle A spans x: 20→180 and y: 70→230 — all within the 800 × 600 screen, so A lies fully inside.'],
    ['Circle B extremes: x from 150 to 350, y from 130 to 330','B: 250 ± 100 → 150 to 350 (x), 230 ± 100 → 130 to 330 (y). Sab screen ke andar → koi part outside NAHI. (i) done: neither goes outside.','Circle B spans x: 150→350, y: 130→330 — also fully inside. So (i) answer: no part of either circle is outside the screen.'],
    ['Distance between centres: AB = √((250−100)² + (230−150)²)','(150)² + (80)² = 22500 + 6400 = 28900. √28900 = 170. Centres 170 pixels apart hain.','AB = √(150² + 80²) = √28900 = 170 pixels.'],
    ['Compare AB with r_A + r_B = 180','Circles tab intersect karte hain jab |r₁ − r₂| ≤ d ≤ r₁ + r₂. Yahan 20 ≤ 170 ≤ 180 ✓ → intersect karte hain (2 points).','Circles intersect when the centre distance is between |r₁−r₂| = 20 and r₁+r₂ = 180. Since 20 ≤ 170 ≤ 180, they intersect at two points.']],
   ans:'(i) No — both circles lie fully on the screen · (ii) Yes — they intersect (AB = 170 < 180 = r_A + r_B)'},
  {q:'Plot A(2, 1), B(−1, 2), C(−2, −1) and D(1, −2). Is ABCD a square? Explain, and find its area.',
   why:'Chess board ke kisi bhi tilted square ke corners ke coordinates se hi uska area nikal aata hai — na ruler, na protractor.',
   steps:[
    ['Find all four sides with the distance formula','AB: shifts (−3, 1) → √(9+1) = √10. BC: (−1, −3) → √10. CD: (3, −1) → √10. DA: (1, 3) → √10. Charo sides √10 — sab barabar!','AB = BC = CD = DA = √10 — all four sides are equal, so ABCD is at least a rhombus.'],
    ['Equal sides alone → rhombus. Check the angles / diagonals','Square hone ke liye diagonals barabar hone chahiye. AC: shifts (−4, −2) → √(16+4) = √20. BD: shifts (2, −4) → √(4+16) = √20. Diagonals bhi barabar!','A rhombus with EQUAL diagonals is a square. AC = √20 and BD = √20 — the diagonals match, so ABCD is a square.'],
    ['(Alternative check: adjacent sides perpendicular)','AB ka slope = (2−1)/(−1−2) = −1/3. BC ka slope = (−1−2)/(−2+1) = 3. (−1/3) × 3 = −1 → perpendicular corner at B ✓','Product of slopes of AB and BC is (−1/3)(3) = −1, so the corner at B is 90° — another proof it is a square.'],
    ['Area = side² = (√10)² = 10 square units','Side √10 ka square = 10. Bas itna hi — plotting ke bina bhi area mil gaya.','Area = (√10)² = 10 square units.']],
   ans:'Yes — a square with side √10 and equal diagonals √20 · Area = 10 square units'}
 ]}
]};

<script>
'use strict';
/* ============================================================
   BOOK ZONE DATA · part 2 — Polynomial Kingdom
   (Book Ch 2: Linear Polynomials + Book Ch 4: Algebraic Identities)
   ============================================================ */
window.BOOKZ=window.BOOKZ||{};
BOOKZ.poly={
 src:'Ganita Manjari · Grade 9 · Part I — Book Ch 2 (Linear Polynomials) + Book Ch 4 (Algebraic Identities)',
 sets:[
 {set:'Exercise Set 2.1 — Degrees & Coefficients',qs:[
  {q:'Find the degrees of: (i) 2x² − 5x + 3 (ii) y³ + 2y − 1 (iii) −9 (iv) 4z − 3',
   why:'Degree polynomial ki "class" hai — usse pata chalta hai graph ka shape aur kitne solutions milenge. Kisi bhi expression ko dekhte hi degree bolo toh aadha kaam ho gaya.',
   steps:[
    ['Degree = highest power of the variable','Degree matlab variable ki SABSE BADI power. Sirf highest dekhna hai — baaki terms ignore.','The degree of a polynomial is the highest power of the variable in it.'],
    ['(i) powers are 2, 1, 0 → degree 2','2x² me power 2, 5x me power 1, 3 me 0. Highest = 2 → degree 2 (quadratic).','In 2x² − 5x + 3 the highest power is 2, so the degree is 2.'],
    ['(ii) powers 3, 1, 0 → degree 3; (iii) no variable → degree 0','y³ + 2y − 1: highest 3 → degree 3 (cubic). −9 me variable hi nahi — constant polynomial, degree 0.','y³ + 2y − 1 has degree 3. The constant −9 has no variable, so its degree is 0.'],
    ['(iv) 4z − 3: highest power 1 → degree 1','Power 1 wale ko LINEAR polynomial bolte hain — isi poore chapter ka hero.','4z − 3 has degree 1 — a linear polynomial, the hero of this chapter.']],
   ans:'(i) 2 · (ii) 3 · (iii) 0 · (iv) 1'},
  {q:'What are the coefficients of x² and x³ in x⁴ − 3x³ + 6x² − 2x + 7, and what is the constant term of 9x³ + 5x² − 8x − 10?',
   why:'Coefficient = us term ka "quantity tag". Physics formulas me bhi yehi hota hai — ½gt² me ½ g ka coefficient hai.',
   steps:[
    ['Spot the exact term, then read its number','x² ka coefficient matlab x² kitne "copies" lag rahi hain. x⁴ − 3x³ + 6x² − 2x + 7 me x² wali term = +6x².','In x⁴ − 3x³ + 6x² − 2x + 7, the x²-term is 6x², so the coefficient of x² is 6.'],
    ['Coefficient of x³ = −3, coefficient of x² = 6','x³ ki term −3x³ hai → coefficient −3 (minus yaad rakhna!). x² ki term 6x² → coefficient 6.','The coefficient of x³ is −3 (sign included!) and the coefficient of x² is 6.'],
    ['Constant term = jisme variable ho hi na','9x³ + 5x² − 8x − 10 me variable-free term = −10. Isliye constant term −10.','The constant term of 9x³ + 5x² − 8x − 10 is −10 — the term with no variable at all.']],
   ans:'coeff of x³ = −3 · coeff of x² = 6 · constant term = −10'}
 ]},
 {set:'Exercise Set 2.2 — Values & Word Problems',qs:[
  {q:'Find the value of the linear polynomial 5x − 3 at: (i) x = 0 (ii) x = −1 (iii) x = 2',
   why:'Polynomial ko "machine" samjho: x daalo, output lo. Auto-rickshaw meter bhi yehi hai — distance daalo, fare niklo.',
   steps:[
    ['Substitute x = 0: 5(0) − 3','x ki jagah 0 rakho: 5×0 = 0, toh 0 − 3 = −3.','Put x = 0: 5(0) − 3 = −3.'],
    ['Substitute x = −1: 5(−1) − 3','5 × (−1) = −5. −5 − 3 = −8. Negative se multiply karte waqt sign dhyan se.','Put x = −1: 5(−1) − 3 = −5 − 3 = −8.'],
    ['Substitute x = 2: 5(2) − 3 = 7','5 × 2 = 10, 10 − 3 = 7. Machine ne teen alag outputs diye — yehi polynomial ki "value" hai.','Put x = 2: 10 − 3 = 7.']],
   ans:'(i) −3 · (ii) −8 · (iii) 7'},
  {q:'The present age of Salil\'s mother is three times Salil\'s present age. After 5 years, their ages will add up to 70 years. Find their present ages.',
   why:'Age problems insurance forms, Aadhaar corrections — sab me aate hain. "Abhi" aur "5 saal baad" ka farak line me kholna hi solution hai.',
   steps:[
    ['Name the unknown: Salil = x, so mother = 3x','Salil ki age x maan lo. Mother 3 guna → 3x. "Present age" ke liye ye dono variables ready.','Let Salil\'s present age be x. Then his mother\'s is 3x.'],
    ['After 5 years BOTH grow: (x + 5) + (3x + 5) = 70','Galti jo sab karte hain: sirf ek ko +5 dena! DONO 5 saal budhe honge. Sum: x + 5 + 3x + 5 = 70.','After 5 years Salil is x + 5 and his mother is 3x + 5, and their sum is 70.'],
    ['Simplify: 4x + 10 = 70 → 4x = 60','x + 3x = 4x; 5 + 5 = 10. Dono sides − 10: 4x = 60.','Combine: 4x + 10 = 70, so 4x = 60.'],
    ['x = 15 → Salil is 15, mother is 45','Dono sides ÷ 4: x = 15. Mother = 3×15 = 45. Check: (15+5) + (45+5) = 20 + 50 = 70 ✓','x = 15, so Salil is 15 and his mother is 45. Check: 20 + 50 = 70 ✓']],
   ans:'Salil = 15 years, Mother = 45 years'},
  {q:'Ruby has 3 times as many two-rupee coins as she has five-rupee coins. If she has a total ₹88, how many coins of each type does she have?',
   why:'Piggy bank, cash drawer, chhutad change — "kitne coin kis type ke" classic inventory problem hai, cashier roz karta hai.',
   steps:[
    ['Let five-rupee coins = f, so two-rupee coins = 3f','Jo KAM hain usse f bolo — two-rupee coins 3 guna zyada hain, toh wo 3f banenge.','Let the number of five-rupee coins be f. Then two-rupee coins = 3f.'],
    ['Money equation: 5 × f + 2 × 3f = 88','Har five-rupee coin ₹5 deta hai: 5f rupees. Har two-rupee coin ₹2: 2 × 3f = 6f rupees. Total 5f + 6f = 88.','Value: 5f + 2(3f) = 5f + 6f = 88 rupees.'],
    ['11f = 88 → f = 8','5f + 6f = 11f. Dono sides ÷ 11: f = 8.','So 11f = 88, giving f = 8.'],
    ['8 five-rupee coins and 24 two-rupee coins','Two-rupee = 3 × 8 = 24. Total coins = 32. Check money: 8×5 + 24×2 = 40 + 48 = ₹88 ✓','Ruby has 8 five-rupee coins and 24 two-rupee coins — total value 40 + 48 = ₹88 ✓.']],
   ans:'8 five-rupee coins · 24 two-rupee coins'}
 ]},
 {set:'Exercise Set 2.4 — Linear Growth & Decay',qs:[
  {q:'A mobile phone is bought for ₹10,000. Its value decreases by ₹800 every year. (i) Find its value after 3 years. (ii) Find an expression relating value v and time t, and explain why it represents linear decay.',
   why:'Phone, bike, laptop — sab depreciate hote hain. Resale price ka andaza lagane ka formula yehi hai; OLX seller bhi yehi sochta hai.',
   steps:[
    ['Each year costs ₹800 → after 3 years, 3 × 800 = ₹2400 gone','3 saal me total girawat = 800 × 3 = 2400 rupees.','Total decrease in 3 years = 800 × 3 = ₹2400.'],
    ['Value after 3 years = 10000 − 2400 = ₹7,600','Starting value minus total fall: 10000 − 2400 = 7600.','v = 10000 − 2400 = ₹7,600.'],
    ['General expression: v = 10000 − 800t','t saal ke liye: value = starting − (rate × time) = 10000 − 800t. Ye hi linear relationship hai.','After t years, v = 10000 − 800t.'],
    ['Why LINEAR decay? Rate per year is CONSTANT','Har saal EXACTLY ₹800 ka girawat — change per step constant hai, isliye graph ek seedhi neeche jaati line (negative slope −800). Value kabhi negative nahi hogi: t = 12.5 pe zero.','Because the change each year is a constant −800, the graph is a straight line falling with slope −800: linear decay.']],
   ans:'(i) ₹7,600 · (ii) v = 10000 − 800t (linear decay, slope −800)'}
 ]},
 {set:'End-of-Chapter Exercises',qs:[
  {q:'A positive number is 5 times another number. If 21 is added to both the numbers, then one of the new numbers becomes twice the other new number. What are the numbers?',
   why:'Ratio-based problems profit-sharing, recipe scaling, map scales me sab aate hain — "5 times" ko x aur 5x me kholna hi skill hai.',
   steps:[
    ['Let the smaller number = x, so bigger = 5x','"5 times another" → x aur 5x. Dono positive hain, tension nahi.','Let the numbers be x and 5x (x > 0).'],
    ['Add 21 to both: x + 21 and 5x + 21','Dono numbers ko 21 mila — dono badal jayenge.','After adding 21 to each: x + 21 and 5x + 21.'],
    ['New condition: 5x + 21 = 2(x + 21)','"one becomes twice the other" — bada wala (5x+21) ab chhota wale (x+21) ka double hai.','The larger new number is twice the smaller: 5x + 21 = 2(x + 21).'],
    ['Expand: 5x + 21 = 2x + 42 → 3x = 21 → x = 7','Right side kholo: 2x + 42. Dono sides − 2x: 3x + 21 = 42. Dono sides − 21: 3x = 21. ÷3: x = 7.','Expanding: 5x + 21 = 2x + 42 → 3x = 21 → x = 7.'],
    ['Numbers are 7 and 35 — verify!','Check: 7+21 = 28, 35+21 = 56. 56 = 2 × 28 ✓ Perfect.','The numbers are 7 and 35. Check: 28 and 56, and 56 = 2 × 28 ✓.']],
   ans:'The two numbers are 7 and 35'},
  {q:'If temperature in Kelvin is x K and in Fahrenheit is y °F, then y = (9/5)(x − 273) + 32. (i) Find y when x = 313 K. (ii) Find x when y = 158 °F.',
   why:'Science lab me Kelvin, ghar me Celsius/Fahrenheit — same temperature, different "address". Conversion bhi ek linear polynomial hi hai!',
   steps:[
    ['Substitute x = 313: y = (9/5)(313 − 273) + 32','Bracket PEHLE: 313 − 273 = 40. BODMAS yaad rakho.','Substitute: y = (9/5)(40) + 32 (bracket first!).'],
    ['(9/5) × 40 = 72 → y = 72 + 32 = 104 °F','40 ÷ 5 = 8, 8 × 9 = 72. Plus 32 → 104. Toh 313 K = 104 °F.','(9/5)(40) = 72, so y = 72 + 32 = 104 °F.'],
    ['Reverse: 158 = (9/5)(x − 273) + 32 → subtract 32 first','Ab ulta jana hai. Dono sides − 32: 126 = (9/5)(x − 273).','For (ii): subtract 32 from both sides: 126 = (9/5)(x − 273).'],
    ['Multiply by 5/9: x − 273 = 126 × 5/9 = 70 → x = 343 K','126 × 5 = 630; 630 ÷ 9 = 70. Dono sides + 273: x = 343. Toh 158 °F = 343 K.','Multiply both sides by 5/9: x − 273 = 70, so x = 343 K.']],
   ans:'(i) 104 °F · (ii) 343 K'},
  {q:'The graph of a linear polynomial p(x) passes through (1, 5) and (3, 11). (i) Find p(x). (ii) Find where the graph cuts the axes.',
   why:'Do points milo → poori line ka rule nikal lo. Trending stock price, speed ke saath distance — 2 data points se future predict karna yehi hai.',
   steps:[
    ['Let p(x) = ax + b — every linear polynomial looks like this','Linear polynomial ka general form ax + b. Bas a (slope) aur b (y-intercept) dhundne hain.','Write p(x) = ax + b with unknowns a and b.'],
    ['Both points must satisfy it: a + b = 5 and 3a + b = 11','(1,5): p(1) = a + b = 5. (3,11): p(3) = 3a + b = 11. Do equations, do unknowns.','Point (1, 5) gives a + b = 5; point (3, 11) gives 3a + b = 11.'],
    ['Subtract: (3a + b) − (a + b) = 11 − 5 → 2a = 6 → a = 3','Equations minus karo — b gayab! 2a = 6 → a = 3. Slope = 3 matlab x har 1 badhe toh y 3 badhta hai.','Subtracting kills b: 2a = 6, so a = 3 (the slope).'],
    ['Back-substitute: 3 + b = 5 → b = 2 → p(x) = 3x + 2','a = 5−b wali equation me daalo: 3 + b = 5 → b = 2. p(x) = 3x + 2.','Then 3 + b = 5 gives b = 2, so p(x) = 3x + 2.'],
    ['Axes cuts: y-axis at (0, 2), x-axis at (−2/3, 0)','p(0) = 2 → y-axis cut (0,2). p(x) = 0: 3x + 2 = 0 → x = −2/3 → x-axis cut (−2/3, 0).','p(0) = 2 gives the y-cut (0, 2); 3x + 2 = 0 gives the x-cut (−2/3, 0).']],
   ans:'(i) p(x) = 3x + 2 · (ii) cuts y-axis at (0, 2), x-axis at (−2/3, 0)'}
 ]},
 {set:'Book Ch 4 · Exercise Set 4.1 & 4.3 — Identities at Work',qs:[
  {q:'Using (a + b)² = a² + 2ab + b², expand: (i) (7x + 4y)²',
   why:'Yahi identity aage mental maths, physics (kinematics), aur poore algebra me kaam karegi. Tiles se dekho toh ek square ke 4 tukde ban jaate hain.',
   steps:[
    ['Match: a = 7x, b = 4y','Identity me a ki jagah 7x aur b ki jagah 4y rakhna hai. (a+b)² ko teen tukdon me kholte hain: a², 2ab, b².','Set a = 7x and b = 4y in the identity.'],
    ['a² = (7x)² = 49x²','Dono ko square karo: 7² = 49 aur x². (7x)² = 49x² — power har factor pe lagti hai.','(7x)² = 49x².'],
    ['2ab = 2 × 7x × 4y = 56xy','Middle term: 2 × 7 × 4 = 56, x ko y se multiply → xy. Ye term sabse aasan bhool jaate hain — 2ab hamesha yaad!','The middle term: 2 × 7x × 4y = 56xy — this is the term everyone forgets.'],
    ['b² = (4y)² = 16y² → answer: 49x² + 56xy + 16y²','4² = 16 with y². Teen terms jodo: 49x² + 56xy + 16y².','(4y)² = 16y². Answer: 49x² + 56xy + 16y².']],
   ans:'49x² + 56xy + 16y²'},
  {q:'Using the same identity, find (105)².',
   why:'Calculator ke bina 5-second me bade squares! Bank exams, aptitude tests me yehi trick kaam aati hai.',
   steps:[

    ['a² = 100² = 10000','100 ka square 10000 — ek ke baad chaar zero.','(100)² = 10000.'],
    ['2ab = 2 × 100 × 5 = 1000','Middle term: 2 × 100 × 5 = 1000.','2ab = 2 × 100 × 5 = 1000.'],
    ['b² = 25 → 10000 + 1000 + 25 = 11025','Sab jodo: 10000 + 1000 + 25 = 11025. Calculator ke bina!','Add: 10000 + 1000 + 25 = 11025.']],

  {q:'Find 117² using a suitable identity.',
   why:'117 jaise "boring" numbers bhi identity se 4 lines me square ho jaate hain — exam me saving 1 minute = 1 extra question.',
   steps:[
    ['Choose the split: 117 = 100 + 17 (or 120 − 3)','Do options hain: (100 + 17) ya (120 − 3). (a−b) wala chhota numbers deta hai — 120 − 3 lena smarter hai.','117² can be (100 + 17)² or (120 − 3)². Pick (120 − 3)² for smaller numbers.'],
    ['Use (a − b)² = a² − 2ab + b²: 120² − 2(120)(3) + 3²','a = 120, b = 3. Identity ka minus wala version: middle term MINUS.','Apply (a − b)² = a² − 2ab + b².'],
    ['14400 − 720 + 9 = 13689','14400 − 720 = 13680; +9 → 13689.','14400 − 720 + 9 = 13689.']],

  {q:'Factor completely: 16y² − 24y + 9',
   why:'Factorisation expansion ka REVERSE hai. Area diya hai, sides dhundni hain — interior design, farming plots, sab me ulta kaam.',
   steps:[
    ['Check the pattern: is it a perfect square?','Pattern dekho: first term 16y² = (4y)², last term 9 = 3². Middle −24y? Test: 2 × 4y × 3 = 24y ✓ (sign negative toh minus version).','Check for a perfect square: 16y² = (4y)², 9 = 3², and 2·(4y)·3 = 24y matches the middle term.'],
    ['Use (a − b)² = a² − 2ab + b² with a = 4y, b = 3','Sign negative hai isliye MINUS identity: a² − 2ab + b² = (a − b)².','Since the middle term is negative, use (a − b)² with a = 4y, b = 3.'],
    ['16y² − 24y + 9 = (4y − 3)²','Seedha answer: (4y − 3)². Verify karo expand karke: 16y² − 24y + 9 ✓','So 16y² − 24y + 9 = (4y − 3)². (Verify by expanding!)']],
   ans:'(4y − 3)²'},
  {q:'A rectangular pool has area 2x² + 7x + 3 square hastas. If its width is (2x + 1) hastas, find its length.',
   why:'Area = length × width — algebra me iska matlab "expression ko factor karo". Old units (hasta) ke saath history bhi mili!',
   steps:[
    ['Area = length × width → length = area ÷ width','Formula se: length = (2x² + 7x + 3) ÷ (2x + 1). Divide karne ke liye FACTORISE karo.','Length = Area ÷ Width = (2x² + 7x + 3)/(2x + 1). Factorise the area.'],
    ['Split the middle term: 7x = 6x + x','2x² + 7x + 3: aisa jodo ki grouping ho. 7x = 6x + x: 2x² + 6x + x + 3. Product check: 2×3 = 6, aur 6x·x = 6x² = product of ends ✓','Split 7x = 6x + x (since 2 × 3 = 6 and 6 + 1 = 7).'],
    ['Group: 2x(x + 3) + 1(x + 3) = (x + 3)(2x + 1)','Pehli do terms me 2x common, aakhri do me 1: 2x(x+3) + 1(x+3). Common (x+3) bahar: (x+3)(2x+1).','Grouping: 2x(x + 3) + 1(x + 3) = (x + 3)(2x + 1).'],
    ['Length = (x + 3) hastas — the other factor','Area = (2x+1)(x+3), width = (2x+1) diya gaya → length = (x + 3).','Since Area = (2x + 1)(x + 3) and width = 2x + 1, the length is (x + 3) hastas.']],

  {q:'The village playground is a square of side 40 m. A walking path of width s metres is built around it. Find an expression for the area of the path.',

    ['Big square area: (40 + 2s)²','Whole area (playground + path) = (40 + 2s)². Identity se: 1600 + 160s + 4s².','Outer area = (40 + 2s)² = 1600 + 160s + 4s².'],
    ['Playground area: 40² = 1600','Andar wala square fixed: 1600 m².','Playground area = 1600 m².'],
    ['Path area = outer − inner = (1600 + 160s + 4s²) − 1600 = 4s² + 160s','Subtract: 1600 cancel! Path ka area = 4s² + 160s square metres. (s = 2 ho toh 16 + 320 = 336 m².)','Path area = (40 + 2s)² − 40² = 4s² + 160s square metres.']],

 src:'Ganita Manjari · Grade 9 · Part I — Book Ch 3 (The World of Numbers)',
 sets:[
 {set:'Exercise Set 3.2 — Integers (Brahmagupta style)',qs:[
  {q:'The temperature in the high-altitude desert of Ladakh is 4 °C at noon. By midnight it drops by 15 °C. What is the midnight temperature?',
   why:'Weather apps, hill trips, freezer settings — temperature exactly aise hi chalta hai. Drop matlab MINUS.',
   steps:[
    ['"Drops by 15" means subtract 15','Drop = girti hai = minus. Starting 4°C se 15 kam karna hai: 4 − 15.','A drop of 15 means we subtract: new temperature = 4 − 15.'],
    ['4 − 15: number line pe 15 kadam LEFT','4 me se 15 nahi katega — 4 se 15 kadam left jao: 4 → 0 (4 kadam) → aur 11 kadam = −11. Brahmagupta ka debt idea: jab cheez kam pad jaye, negative.','On the number line, move 15 steps left from 4: you pass 0 after 4 steps and land 11 further left, at −11.'],
    ['Midnight temperature = −11 °C','Freezing se bhi 11 degree neeche — Ladakh normal!','The midnight temperature is −11 °C.']],
   ans:'−11 °C'},
  {q:'A spice trader takes a loan (debt) of ₹850. Next day he makes a profit (fortune) of ₹1,200. The following week he incurs a loss of ₹450. Write this as an equation using integers and find his final financial standing.',
   why:'Brahmagupta ne yehi kiya tha — debt = negative (ṛiṇa), fortune = positive (Dhana). Aaj ka bank statement exactly yahi system hai.',
   steps:[
    ['Loan = −850, profit = +1200, loss = −450','Ṛiṇa (debt) negative: −850. Dhana (fortune) positive: +1200. Loss phir negative: −450.','Loan → −850, profit → +1200, loss → −450 (Brahmagupta\'s dhana/ṛiṇa convention).'],
    ['Equation: −850 + 1200 − 450','Teen events ko sign ke saath jodo.','Combine the three events: −850 + 1200 − 450.'],
    ['−850 + 1200 = +350','1200 me se 850 ka debt chuka do — 350 bacha, ab profit side pe.','−850 + 1200 = +350 — the trader is now in fortune.'],
    ['350 − 450 = −100 → net debt ₹100','350 se 450 ka loss — phir debt me: −100. Negative number ek story kehta hai!','350 − 450 = −100 — back into debt. Final standing: −100 (owes ₹100).']],
   ans:'−850 + 1200 − 450 = −100 → a net debt of ₹100'},
  {q:'Calculate using Brahmagupta\'s laws: (i) (−12) × 5 (ii) (−8) × (−7) (iii) 0 − (−14) (iv) (−20) ÷ 4',
   why:'Sign rules har exam, EMI, physics — sab jagah. Ek baar rule pakka, lifetime set.',
   steps:[
    ['Rule: same signs → PLUS, different signs → MINUS','Multiply/divide me: (+)(+) = +, (−)(−) = +, (+)(−) = −. Sizes alag se multiply/divide hote hain.','For × and ÷: like signs give +, unlike signs give −. Handle sizes separately from signs.'],
    ['(i) (−12) × 5 = −60','Signs alag → minus. 12 × 5 = 60 → −60.','(−12) × 5 = −60 (unlike signs).'],
    ['(ii) (−8) × (−7) = +56','Dono minus → PLUS. 8 × 7 = 56. "Do galat ek saath = sahi"!','(−8) × (−7) = 56 (like signs give positive).'],
    ['(iii) 0 − (−14) = 0 + 14 = 14','Minus ke saath minus = plus. (Debt maaf = labh!)','Subtracting a negative ADDS: 0 − (−14) = 14.'],
    ['(iv) (−20) ÷ 4 = −5','Signs alag → minus. 20 ÷ 4 = 5 → −5.','(−20) ÷ 4 = −5 (unlike signs).']],
   ans:'(i) −60 · (ii) 56 · (iii) 14 · (iv) −5'}
 ]},
 {set:'Exercise Set 3.3 & 3.4 — Rational Numbers',qs:[
  {q:'Find the sum: (i) 2/5 + 3/10 (ii) −4/7 + 3/14',
   why:'Pizza slices alag size me cut ho toh pehle SAME size ke slices banao — yehi LCM ka kaam hai.',
   steps:[
    ['Different denominators → same banao (LCM)','2/5 aur 3/10: LCM(5,10) = 10. 7 aur 14: LCM = 14.','Rewrite both fractions with the LCM of the denominators.'],
    ['(i) 2/5 = 4/10 → 4/10 + 3/10 = 7/10','5 → 10 karne ke liye upar-neeche ×2: 2/5 = 4/10. 4 + 3 = 7.','(i) 2/5 = 4/10, so the sum is 7/10.'],
    ['(ii) −4/7 = −8/14 → −8/14 + 3/14 = −5/14','7 → 14: ×2. −8 + 3 = −5. Sign numerator ke saath chalta hai.','(ii) −4/7 = −8/14, so the sum is −5/14.']],
   ans:'(i) 7/10 · (ii) −5/14'},
  {q:'Find three distinct rational numbers strictly between −1/2 and 1/4.',
   why:'Rationals ke beech INFINITELY many aur rationals hote hain — "density" ka pehla hands-on feel.',
   steps:[
    ['Common denominator banao taaki gap dikhe','−1/2 aur 1/4: LCM 4 → −2/4 aur 1/4. Beech me sirf −1/4 dikh raha hai. Densify!','Write −1/2 = −2/4 and 1/4 — only −1/4 shows up. We need more room.'],
    ['Scale to eighths: −4/8 and 2/8','Dono ko ×2 upar-neeche: −1/2 = −4/8, 1/4 = 2/8. Ab beech me: −3/8, −2/8, −1/8, 0, 1/8.','Scaling to eighths reveals −3/8, −2/8, −1/8, 0, 1/8.'],
    ['Pick any three: −3/8, 0, 1/8','Teeno strictly beech hain ✓. (−2/8 = −1/4 bhi chalega.)','One valid answer: −3/8, 0, 1/8.'],
    ['Aur bhi — infinity tak','16ths, 32nds... denominator badhao, aur numbers milte rahenge. Isliye "infinitely many".','With denominators 16, 32, … you keep finding more — that is density.']],
   ans:'e.g. −3/8, 0, 1/8 (any three strictly between work)'},
  {q:'Find three rational numbers between 3.1415 and 3.1416.',
   why:'π = 3.14159... isi gali me rehta hai! Decimals me beech ka number = digit chipkao.',
   steps:[
    ['Decimals me "beech" = extra digit','3.1415 aur 3.1416 ke beech: 5th decimal digit 1 se 9 tak kuch bhi — 3.14151 … 3.14159.','Between 3.1415 and 3.1416, append any 5th digit from 1 to 9.'],
    ['Candidates: 3.14151, 3.14155, 3.14159','Teeno strictly beech ✓ — check: 3.1415 < 3.14151 < 3.1416.','Examples: 3.14151, 3.14155, 3.14159.'],
    ['Fun fact: π khud isi window me hai','π ≈ 3.14159265… bhi in dono ke beech hai — ek IRRATIONAL, rationals ke beech chhupa hua!','π itself lies in this interval — an irrational hiding among rationals.']],
   ans:'e.g. 3.14151, 3.14155, 3.14159'}
 ]},
 {set:'Exercise Set 3.5 — Terminating, Repeating & Irrational',qs:[
  {q:'Without long division, decide which have terminating decimals: 7/20, 4/15, 13/250.',
   why:'Division se PEHLE denominator ka "DNA test" (sirf 2s aur 5s?) bata deta hai decimal ki qismat. Exam time-saver!',
   steps:[
    ['Rule: terminating ⟺ denominator (lowest form) = only 2s & 5s','Denominator prime factors me todo. Sirf 2/5 → terminating. Koi aur prime (3, 7…) → repeating.','A fraction terminates exactly when its lowest-form denominator has no primes except 2s and 5s.'],
    ['7/20: 20 = 2²×5² → TERMINATES (0.35)','Dono allowed. 7 ÷ 20 = 0.35.','7/20 = 0.35 — terminates.'],
    ['4/15: 15 = 3×5 → REPEATS (0.2666…)','3 villain hai. 4 ÷ 15 = 0.2666… (6 ghumta rehta hai).','4/15 = 0.2666… — repeats (the 3 spoils it).'],
    ['13/250: 250 = 2×5³ → TERMINATES (0.052)','Sirf 2 aur 5. 13 ÷ 250 = 0.052.','13/250 = 0.052 — terminates.']],
   ans:'7/20 → 0.35 (terminates) · 4/15 → repeats · 13/250 → 0.052 (terminates)'},
  {q:'Classify as rational or irrational: (i) √81 (ii) √12 (iii) 0.33333… (iv) 0.123451234512345… (v) 1.01001000100001…',
   why:'Irrationals pehchanna = Number Nagar ka black belt. Decimals ka pattern test karna seekho.',
   steps:[
    ['√81 = 9 — perfect square → RATIONAL','81 = 9². Root nikla integer = rational.','√81 = 9 — rational.'],
    ['√12 = 2√3 → IRRATIONAL','12 = 4×3 → √12 = 2√3. √3 irrational → 2√3 bhi.','√12 = 2√3 — irrational.'],
    ['0.333… and 0.1234512345… → RATIONAL (repeating)','Dono me FIXED block repeat hota hai (3 aur 12345) → rational. 0.333… = 1/3.','Repeating blocks mean rational: 0.333… = 1/3; 0.1234512345… = 12345/99999.'],
    ['1.010010001… → IRRATIONAL (growing gaps)','1 ke beech zeros badhte ja rahe hain (0, 00, 000…) — koi FIXED block repeat nahi → irrational. Trap!','The zero-gaps keep growing — no repeating block → irrational.']],
   ans:'Rational: √81, 0.333…, 0.1234512345… · Irrational: √12, 1.010010001…'},
  {q:'Without dividing, determine whether 18/125 terminates; if so, how many decimal places?',
   why:'"Kitne decimal places" bhi denominator se predict hota hai — max power of 2 ya 5. Billing systems me yehi hota hai.',
   steps:[
    ['Factor: 125 = 5³ → terminates','Sirf 5s → terminating. Koi 2 nahi, koi aur prime nahi.','125 = 5³ → the decimal terminates.'],
    ['Places = max power of 2 or 5 = 3','Rule: places = max(exponent of 2, exponent of 5) = max(0,3) = 3.','Number of decimal places = 3.'],
    ['See it: 18/125 = (18×8)/(125×8) = 144/1000 = 0.144','125 ko 1000 banane ke liye 8 se multiply — 144/1000 = 0.144. Teen places ✓','18/125 = 144/1000 = 0.144.']],
   ans:'Terminating · 3 decimal places · 0.144'}
 ]},
 {set:'End-of-Chapter Exercises',qs:[
  {q:'Prove that √5 is an irrational number.',
   why:'Classic exam proof — "contradiction" ki kala: maan lo rational, phir khud ko galat saabit karo.',
   steps:[
    ['Assume the opposite: √5 = p/q (lowest terms)','Maan lo √5 = p/q, p-q co-prime (no common factor).','Suppose √5 = p/q in lowest terms.'],
    ['Square: p² = 5q² → 5 | p² → 5 | p','p² me 5 ka factor → p me bhi 5 (prime 5 square me pair bana ke aata hai).','Then p² = 5q², so 5 divides p², hence 5 divides p.'],
    ['Let p = 5k → q² = 5k² → 5 | q','p = 5k: 25k² = 5q² → q² = 5k² → q me bhi 5.','Write p = 5k: then q² = 5k², so 5 divides q too.'],
    ['Contradiction → √5 irrational','p aur q DONO me 5 common — but humne kaha tha lowest terms. Contradiction! → √5 rational ho hi nahi sakta.','Both divisible by 5 contradicts lowest terms, so √5 is irrational. Template works for √2, √3, √7…']],
   ans:'√5 is irrational (proof by contradiction)'}
 ]}
]};

 {set:'Exercise Set 5.2 — Chords & Isosceles Triangles',qs:[
  {q:'Show that the triangle formed by a chord and the centre of the circle is isosceles.',
   why:'Pizza slice dekho — crust (chord) aur centre milake ek triangle banta hai jiske do sides barabar hain. Yehi observation aage ke saare circle theorems ka gate hai.',

    ['Setup: chord AB, centre O — join OA and OB','Chord ke dono ends ko centre se jodo. Triangle OAB ban gaya.','Join the centre O to both endpoints of chord AB, forming triangle OAB.'],
    ['OA = OB = radius','O se circle pe HAR point ki doori radius hai. A aur B dono circle pe hain → OA = OB.','Both A and B lie on the circle, so OA = OB = radius.'],
    ['Two equal sides → isosceles (base angles equal)','Do sides barabar = isosceles triangle. Bonus: ∠OAB = ∠OBA bhi (base angles).','Triangle OAB has two equal sides — it is isosceles, with equal base angles at A and B.']],
   ans:'OA = OB = r, so ∆OAB is isosceles with ∠OAB = ∠OBA'}
 ]},
 {set:'Exercise Set 5.3 — Perpendicular from the Centre',qs:[
  {q:'Two parallel chords of lengths 6 cm and 8 cm are on opposite sides of the centre of a circle. If the radius is 5 cm, find the distance between the midpoints of the chords.',
   why:'Bridge pillars dono taraf — "opposite sides" wala case distance JODTA hai, ghata nahi. Ye trap exam me bahut baar aata hai.',
   steps:[
    ['Drop perpendiculars: centre bisects each chord','Theorem 5: centre se chord pe perpendicular chord ko bisect karta hai. Half-chords: 6/2 = 3 aur 8/2 = 4.','The perpendicular from the centre bisects each chord: half-lengths are 3 and 4.'],
    ['Pythagoras for chord 1: d₁ = √(5² − 3²) = 4','r = hypotenuse 5, half-chord = leg 3 → distance from centre d₁ = √(25−9) = √16 = 4 cm.','For the 6 cm chord: d₁ = √(25 − 9) = 4 cm.'],
    ['Pythagoras for chord 2: d₂ = √(5² − 4²) = 3','Half-chord 4 ke liye: d₂ = √(25−16) = √9 = 3 cm.','For the 8 cm chord: d₂ = √(25 − 16) = 3 cm.'],
    ['Opposite sides → ADD: 4 + 3 = 7 cm','Chords centre ke ULT sides pe hain → unke midpoints ke beech distance = d₁ + d₂ = 7 cm. (Same side hote toh minus hota!)','The chords are on opposite sides, so the midpoint distance is 4 + 3 = 7 cm.']],
   ans:'7 cm'},
  {q:'An isosceles triangle ABC is inscribed in a circle with AB = AC. Show that the altitude from A to BC passes through the centre of the circle.',
   why:'Umbrella ka centre rod seedha canopy ke beech me kyun aata hai? Symmetry ka jawab — aur yahan algebraic proof milta hai.',
   steps:[
    ['Centre must be equidistant from B and C','O se B aur C dono radius doori pe hain: OB = OC. Matlab O, BC ke perpendicular bisector PE PADA hai (equidistant points ka locus).','O satisfies OB = OC, so O lies on the perpendicular bisector of BC.'],
    ['Isosceles altitude = perpendicular bisector','AB = AC wale triangle me A se BC pe daala gaya altitude BC ko bisect bhi karta hai aur perpendicular bhi hai — matlab altitude hi BC ka perpendicular bisector hai.','In an isosceles triangle, the altitude from the apex A is also the perpendicular bisector of the base BC.'],
    ['Both O and the altitude sit on the same line → altitude passes through O','Dono (O aur altitude) BC ke perpendicular bisector pe hain, aur ek hi point (midpoint of BC) se guzarte hain → wahi line! Isliye altitude centre se guzarti hai.','The altitude and the centre both lie on the (unique) perpendicular bisector of BC — so the altitude passes through O.']],
   ans:'The altitude from A is the perpendicular bisector of BC, and the centre lies on it'}
 ]},
 {set:'Exercise Set 5.5 — Chord Lengths',qs:[
  {q:'Find the length of the chord of a circle where the radius is 7 cm and the perpendicular distance from the centre is 6 cm.',
   why:'Ceiling fan ka blade wall se kitna paas — chord-distance relation. Pythagoras ek baar phir!',
   steps:[
    ['Draw: centre O, chord AB, perpendicular OM, OM = 6','Theorem: OM ⊥ AB, aur M midpoint hai. Half-chord = AM = MB.','Draw the perpendicular OM from the centre to the chord; M is the midpoint and OM = 6.'],
    ['Right triangle OMA: OA² = OM² + AM²','r = 7 hypotenuse. 7² = 6² + AM².','In right ∆OMA: OA² = OM² + AM².'],
    ['AM = √(49 − 36) = √13','49 − 36 = 13. AM = √13 cm (√13 ≈ 3.61).','AM = √(49 − 36) = √13 ≈ 3.61 cm.'],
    ['Chord = 2 × AM = 2√13 ≈ 7.21 cm','Chord poora = do half = 2√13 cm.','Chord AB = 2√13 ≈ 7.21 cm.']],
   ans:'2√13 cm (≈ 7.21 cm)'},
  {q:'Explain why: if the perpendicular distance of a chord from the centre is d and the radius is r, then chord length = 2√(r² − d²).',

   steps:[
    ['Half-chord, distance d, and radius form a right triangle','OM = d (distance), AM = half-chord (kya?), OA = r (hypotenuse). Right angle at M (Theorem 4).','OM = d and OA = r are a leg and the hypotenuse of right triangle OMA.'],
    ['Pythagoras: AM² + d² = r²','Legs ka square jodo = hypotenuse ka square: AM² = r² − d².','By Pythagoras: AM² = r² − d².'],
    ['AM = √(r² − d²)','Root lo — ye half-chord hai.','So the half-chord is √(r² − d²).'],
    ['Chord = 2 × half = 2√(r² − d²)','Poora chord dono halves ka sum: 2√(r² − d²). Sanity check: d = 0 → chord = 2r = diameter ✓ (longest chord).','Chord = 2√(r² − d²). Check: d = 0 gives 2r, the diameter — the longest chord.']],

 ]},
 {set:'End-of-Chapter Exercises',qs:[
  {q:'Two parallel chords of lengths 10 cm and 24 cm are on the SAME side of the centre. The distance between the chords is 7 cm. Find the radius.',
   why:'Reverse engineering: chord distances se radius nikalna — wheel design, tunnel boring me real use. Answer guess karoge toh maza aayega (hint: 5-12-13!).',
   steps:[
    ['Half-chords: 5 and 12 → distances x and y from centre','Half of 10 = 5, half of 24 = 12. Chhoti chord zyada door hoti hai: x = √(r²−25), y = √(r²−144).','Half-chords 5 and 12 give distances x = √(r²−25) and y = √(r²−144), with x > y.'],
    ['Same side → gap = x − y = 7','Dono chords ek hi side → distance unke centre-distances ka FARAK: √(r²−25) − √(r²−144) = 7.','Same side means the gap is x − y = 7.'],
    ['Try the 5-12-13 triangle: r = 13','Test r = 13: x = √(169−25) = √144 = 12, y = √(169−144) = √25 = 5. 12 − 5 = 7 ✓','Try r = 13: x = 12, y = 5, and 12 − 5 = 7 ✓.'],
    ['Radius = 13 cm','Famous 5-12-13 Pythagorean triple ne kaam kar diya! (Algebra se bhi solve hota: dono squares subtract karo.)','Radius = 13 cm — the 5-12-13 triple in action.']],
   ans:'r = 13 cm'},
  {q:'Quadrilateral MNOP is inscribed in a circle. If MN is a diameter, what can you say about ∠MOP and ∠MNP? Explain.',
   why:'Central angle theorem ka direct application — arc MP ko centre se aur circumference se dono jagah se dekhna.',
   steps:[
    ['Both angles stare at the SAME arc MP','∠MOP centre pe bana hai, chords OM & OP se. ∠MNP circle PE (point N pe) bana hai, chords NM & NP se. Dono ka "target" arc MP hai.','∠MOP is the angle at the centre and ∠MNP an inscribed angle — both subtend the same arc MP.'],
    ['Central angle theorem: ∠MOP = 2 ∠MNP','Centre pe bana angle hamesha DOUBLE hota hai circle pe bane (same arc ke liye) inscribed angle ka. Ye book ka main theorem hai.','The angle at the centre is twice the inscribed angle on the same arc: ∠MOP = 2∠MNP.'],
    ['Answer: ∠MOP = 2 ∠MNP','Isliye ∠MOP, ∠MNP ka exact double hai — hamesha, chahe N kahan bhi ho (arc MP ke opposite side).','So ∠MOP is exactly twice ∠MNP, wherever N sits on the opposite arc.']],

    ['Fares: 240, 280, 320, … — an AP with a = 240, d = 40','Har km pe ₹40 badh raha hai — constant difference = AP ki pehchaan.','Fares 240, 280, 320, … form an AP: first term 240, common difference 40.'],
    ['nth fare: tn = 240 + (n−1)×40 = 200 + 40n','Formula lagao aur simplify: 240 + 40n − 40 = 200 + 40n. Fixed 200 wapas dikh gaya!','tn = 240 + (n−1)(40) = 200 + 40n — the fixed fee reappears.'],
    ['10 km: 200 + 40×10 = ₹600','n = 10 daalo: 600 rupaye.','For n = 10: 200 + 400 = ₹600.']],
   ans:'tn = 200 + 40n · 10 km trip = ₹600'}
 ]},
 {set:'Exercise Set 8.3 — Geometric Progressions',qs:[
  {q:'Find the 12th term of a GP with common ratio 2, whose 8th term is 192.',
   why:'Ek door ka term diya, aur door ka term chahiye — beech ka gap ratio ke powers se bridge hota hai. Shortcut seekho!',
   steps:[
    ['t12 and t8 ka relationship: t12 = t8 × r⁴','Formula se: t12 = ar¹¹, t8 = ar⁷. Ratio: t12/t8 = r⁴. Beech me exactly 4 multiplications.','t12 = ar¹¹ = ar⁷ × r⁴ = t8 · r⁴.'],
    ['t12 = 192 × 2⁴ = 192 × 16','2⁴ = 16. 192 × 16 = 3072.','t12 = 192 × 16 = 3072.'],
    ['Answer: 3072 — without even finding a!','a ki zaroorat hi nahi padi — relative jump kaam kar gayi. Ye trick time bachati hai.','The 12th term is 3072, found without computing the first term.']],
   ans:'t12 = 3072'},
  {q:'Which term of the GP 2, 6, 18, … is 4374? Write both the explicit and recursive formulas.',
   why:'GP me "kaunsa term" = exponent solve karna. Powers of 3 pehle chhant lo — 2187 = 3⁷ yaad ho toh 10 second ka kaam.',
   steps:[
    ['GP form: tn = a·r^(n−1) with a = 2, r = 3','6/2 = 3, 18/6 = 3 — ratio constant 3.','tn = 2·3^(n−1) is the explicit formula.'],
    ['Set 2·3^(n−1) = 4374 → 3^(n−1) = 2187','Dono sides ÷ 2: 2187. Ye 3 ki power hai: 3⁷ = 2187 (3,9,27,81,243,729,2187).','2·3^(n−1) = 4374 gives 3^(n−1) = 2187 = 3⁷.'],
    ['n − 1 = 7 → n = 8','Exponents barabar → n = 8. Aathwa term hi 4374 hai.','n − 1 = 7, so the 8th term is 4374.'],
    ['Recursive form: t1 = 2, t(n+1) = 3·tn','Har term pichle ko ×3 — yehi recursive rule hai.','Recursive: t1 = 2, t(n+1) = 3 t(n).']],
   ans:'8th term · tn = 2·3^(n−1) · t1 = 2, t(n+1) = 3tn'},
  {q:'A ball is dropped from 80 m and bounces back to 60% of its previous height each time. (i) Height after the 5th bounce? (ii) Total vertical distance travelled by the time it hits the ground for the 6th time?',
   why:'Basketball, rubber ball, physics lab — bounce = GP in action. Ratio 0.6 har baar multiply hota hai.',
   steps:[
    ['Heights form a GP: 80, 48, 28.8, … with r = 0.6','Har bounce 60% = ×0.6. Heights: 80×0.6ⁿ.','Bounce heights: 80·(0.6)ⁿ — a GP with ratio 0.6.'],
    ['(i) 5th bounce: 80 × 0.6⁵ = 80 × 0.07776 ≈ 6.22 m','0.6⁵ = 0.07776. ×80 = 6.2208 m.','After the 5th bounce: 80(0.6)⁵ ≈ 6.22 m.'],
    ['(ii) Down 80, then 5 up-down pairs of GP heights','Distance = 80 + 2×(48 + 28.8 + 17.28 + 10.368 + 6.2208). Har bounce UPAR bhi jaata hai aur NEECHE bhi — isliye 2× (except the final hit).','Total = 80 + 2(48 + 28.8 + 17.28 + 10.368 + 6.2208).'],
    ['Sum inside: 110.6688 → total ≈ 80 + 221.38 = 301.38 m','GP terms add karo: 110.6688. Double: 221.3776. Plus initial 80 → ≈ 301.38 m.','Total vertical distance ≈ 301.38 m.']],
   ans:'(i) ≈ 6.22 m · (ii) ≈ 301.38 m'},
  {q:'Sierpiński triangle: each black triangle becomes 3 at the next stage. If Stage 0 has 1, find the count at stage n and the black area rule (area ×3/4 each stage).',
   why:'Fractals = GP chhupa ke rakhte hain. Sierpiński ka triangle 3ⁿ triangles and (3/4)ⁿ area — dono GP! Nature (fern, snowflake) bhi aisa hi karta hai.',
   steps:[
    ['Count: 1, 3, 9, 27, … → tn = 3ⁿ (a GP with r = 3)','Har stage pe har black triangle 3 banta hai → ×3. Stage n pe 3ⁿ triangles.','Black triangle count at stage n is 3ⁿ — a GP with ratio 3.'],
    ['Stage 4 → 81, Stage 5 → 243','3⁴ = 81, 3⁵ = 243.','Stages 4 and 5 have 81 and 243 black triangles.'],
    ['Area: 1, 3/4, (3/4)², … → (3/4)ⁿ','Har stage pe centre ka 1/4 hissa hat-ta hai → black area ×3/4. Stage n pe (3/4)ⁿ square units.','Black area at stage n is (3/4)ⁿ — a GP with ratio 3/4.'],
    ['n badhao → area → 0, count → ∞','EkGP girti ja rahi hai (area), doosri badhti ja rahi hai (count). Fractal ka jaadu!','As n grows, the count explodes while the area shrinks toward 0.']],
   ans:'Count = 3ⁿ · Area = (3/4)ⁿ square units'}
 ]},
 {set:'End-of-Chapter Exercises',qs:[
  {q:'Find the 31st term of an AP whose 11th term is 38 and 16th term is 73.',
   why:'Do terms diye, doosra term chahiye — classic exam question. d nikalna hi asli game hai.',
   steps:[
    ['Equations: a + 10d = 38, a + 15d = 73','t11 = a+10d, t16 = a+15d — dono equations likho.','t11 = a + 10d = 38 and t16 = a + 15d = 73.'],
    ['Subtract: 5d = 35 → d = 7','Doosri minus pehli: 5d = 35 → d = 7 (common difference).','Subtracting gives 5d = 35, so d = 7.'],
    ['a = 38 − 70 = −32','a + 10(7) = 38 → a = −32.','Then a = 38 − 70 = −32.'],
    ['t31 = a + 30d = −32 + 210 = 178','31st term ke liye 30 jumps: −32 + 30×7 = 178.','t31 = −32 + 210 = 178.']],
   ans:'t31 = 178 (a = −32, d = 7)'},
  {q:'Determine the AP whose third term is 16 and whose 7th term exceeds the 5th term by 12.',
   why:'"t7 exceeds t5 by 12" ka matlab seedha hai: 2d = 12. Translate karne ki aadat daalo — aadhe questions yahin khatam ho jaate hain.',
   steps:[
    ['Translate: t7 − t5 = 12 → (a+6d) − (a+4d) = 12','Dono expand karo — a cancel! 2d = 12.','t7 − t5 = 2d = 12, so d = 6.'],
    ['d = 6 → a + 2d = 16 → a = 4','t3 = a + 2d = 16 → a = 16 − 12 = 4.','From t3 = 16: a + 12 = 16, so a = 4.'],
    ['AP: 4, 10, 16, 22, …','General: a + (n−1)d = 4 + (n−1)6 = 6n − 2.','The AP is 4, 10, 16, 22, … (tn = 6n − 2).']],
   ans:'AP: 4, 10, 16, 22, … (a = 4, d = 6)'},
  {q:'How many three-digit numbers are divisible by 7?',
   why:'"Counting multiples" = AP ka length nikalna. Divisibility, seating, scheduling — counting with steps yahi hai.',
   steps:[
    ['Smallest 3-digit multiple of 7: 105 (7×15)','100 ÷ 7 = 14.28… → aage ka multiple 7×15 = 105.','The smallest is 105.'],
    ['Largest: 994 (7×142)','999 ÷ 7 = 142.7… → 7×142 = 994.','The largest is 994.'],
    ['AP: 105, 112, …, 994 with d = 7 → n = ?','tn = a + (n−1)d: 994 = 105 + (n−1)7.','Solve 994 = 105 + (n−1)(7).'],
    ['(n−1) = 889/7 = 127 → n = 128','889 ÷ 7 = 127 → n = 128 numbers.','n = (994−105)/7 + 1 = 128.']],
   ans:'128 three-digit numbers are divisible by 7'},
  {q:'How many multiples of 4 lie between 10 and 250?',
   why:'"Between" me dono ends EXCLUDE hote hain (10 aur 250 khud multiples nahi hain anyway). Boundary cases ka dhyan — yahi exam trap hai.',
   steps:[
    ['First multiple > 10: 12','10 ke baad pehla 4-multiple = 12.','The first multiple is 12.'],
    ['Last multiple < 250: 248','250 ÷ 4 = 62.5 → 4×62 = 248.','The last is 248.'],
    ['n = (248 − 12)/4 + 1 = 236/4 + 1 = 59 + 1 = 60','Formula: count = (last − first)/d + 1. Yahan 60.','There are 60 multiples of 4.']],
   ans:'60'},
  {q:'The number of bacteria in a culture doubles every hour. If there are 30 bacteria originally, how many at the end of the 2nd, 4th and nth hour?',
   why:'Population growth, viral reels, compound interest — doubling = r = 2 wala GP. Biology + maths combo!',
   steps:[
    ['Counts: 30, 60, 120, … — GP with r = 2','Har ghante ×2. a = 30.','The bacteria count forms a GP: 30·2ⁿ after n hours.'],
    ['2nd hour: 30 × 2² = 120','Do doublings: ×4 → 120.','After 2 hours: 30·2² = 120.'],
    ['4th hour: 30 × 2⁴ = 480','Chaar doublings: ×16 → 480.','After 4 hours: 30·2⁴ = 480.'],
    ['nth hour: 30 × 2ⁿ','General rule: 2ⁿ growth factor. nth hour pe 30·2ⁿ.','After n hours: 30·2ⁿ.']],
   ans:'2 h → 120 · 4 h → 480 · n h → 30·2ⁿ'}
 ]}
]};

<script>
'use strict';
/* ============================================================
