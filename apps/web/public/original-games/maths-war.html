window.BOOKZ=window.BOOKZ||{};
BOOKZ.line={src:'NCERT Class 9 · Linear Equations in Two Variables — classic exam questions',sets:[{set:'NCERT Classic Exercises',qs:[
 {q:'The cost of a notebook is twice the cost of a pen. Write a linear equation in two variables to represent this statement.',
  why:'Statement → equation translation hi algebra ki asli shakti hai. Bill splitting, budgeting — sab yahi hai.',
  steps:[
   ['Name the variables: notebook cost = ₹x, pen cost = ₹y','Jo pata nahi usse variable bolo — dono costs unknown hain.','Let the notebook cost ₹x and the pen cost ₹y.'],
   ['"Twice" means = 2 ×','Notebook 2 guna mehnga → x = 2y.','The notebook costs twice the pen: x = 2y.'],
   ['Equation: x = 2y (or x − 2y = 0)','Standard form me likho: x − 2y = 0. Ek equation, do variables — a linear equation in two variables.','In standard form: x − 2y = 0.']]},
 {q:'A taxi charges ₹8 for the first kilometre and ₹5 per km for every subsequent kilometre. Taking distance as x km and total fare as ₹y, write the equation and find the fare for 7 km.',
  why:'Real taxi/rapido pricing! "First km special rate" = ek constant + variable part — linear equation ka everyday avatar.',
  steps:[
   ['First km costs 8; remaining (x − 1) km cost 5 each','Total = 8 + 5 × (x − 1). Bas structure samjho.','Fare = 8 + 5(x − 1).'],
   ['Simplify: y = 8 + 5x − 5 = 5x + 3','Distribute karo: 5x − 5. Jodo: 5x + 3.','y = 5x + 3.'],
   ['x = 7: y = 5(7) + 3 = 38','7 km ka fare ₹38.','For 7 km: y = 38.']]},
 {q:'Find four different solutions of the equation 2x + y = 7.',
  why:'Ek equation ke INFINITE solutions hote hain — x chuno, y khud nikal aayega. Graph ki poori line hi solution-set hai.',
  steps:[
   ['Pick any x, compute y = 7 − 2x','x ki jagah apni marzi ki value — y apne aap nikal aayega.','Choose x freely and compute y = 7 − 2x.'],
   ['x = 0 → y = 7; x = 1 → y = 5','(0, 7) aur (1, 5) dono solutions hain.','(0, 7) and (1, 5) are solutions.'],
   ['x = 2 → y = 3; x = 3 → y = 1','(2, 3) aur (3, 1). Chaar solutions ready!','(2, 3) and (3, 1) — four solutions: (0,7), (1,5), (2,3), (3,1).'],
   ['Note: infinite solutions exist','x = −1 bhi chalega: (−1, 9). Line ke HAR point solution hai.','Any point on the line 2x + y = 7 is a solution.']]},
 {q:'Give the geometric representation of y = 3 as: (i) an equation in one variable (ii) an equation in two variables.',
  why:'Same equation, different "lens" — ek variable me point, do variables me poori line. Perspective badalne ka khel.',
  steps:[
   ['One variable: y = 3 is a single POINT on the number line','Sirf y ki duniya me y = 3 matlab ek hi point.','In one variable, y = 3 is just the point 3 on the number line.'],
   ['Two variables: y = 3 means y is ALWAYS 3, x free','Ab x bhi hai — lekin y fix. Har x ke liye y = 3: (0,3), (5,3), (−2,3)…','In two variables, y = 3 holds for every x — all points (x, 3).'],
   ['Representation: a HORIZONTAL line 3 units above the x-axis','Wo saare points jodne pe ek horizontal line banti hai jo x-axis ke upar 3 units par hai.','It is the horizontal line passing through (0, 3).']]}]}]};
BOOKZ.euc={src:'NCERT Class 9 · Introduction to Euclid\'s Geometry — classic exam questions',sets:[{set:'NCERT Classic Exercises',qs:[
 {q:'How many lines can pass through: (i) one given point (ii) two given distinct points?',
  why:'Euclid ka pehla postulate hi ye kehta hai — GPS se laptop screen tak, "2 points se 1 line" har design ka base hai.',
  steps:[
   ['(i) One point → INFINITELY many lines','Ek point ke through jitne chahe lines guzar sakti hain — har direction me ek.','Through one point, infinitely many lines pass.'],
   ['(ii) Two distinct points → EXACTLY one line','Euclid\'s Postulate 1: do points se unique line. Ye "unique" hi navigation ka foundation hai.','Through two distinct points there is exactly ONE line (Postulate 1).'],
   ['Test it: two pins on a board — one stretched string only','Do pins me ek hi string seedhi fit hoti hai. Practical proof!','Two pins determine exactly one stretched string.']]},
 {q:'What is the difference between an axiom and a postulate?',
  why:'Definitions clear honi chahiye — exam me 1-mark ka seedha sawaal, aur thinking ke liye foundation.',
  steps:[
   ['Axiom: universal truth used EVERYWHERE in mathematics','Axiom har jagah chalega — algebra me bhi, geometry me bhi. Example: "Things equal to the same thing are equal to each other."','An axiom is a truth assumed across all of mathematics.'],
   ['Postulate: truth specific to GEOMETRY','Postulate sirf geometry ke rules hain. Example: "A line can be drawn through any two points."','A postulate is an assumption specific to geometry.'],
   ['Dono PROOF ke bina accept kiye jaate hain','Na axiom, na postulate — kisi ko prove nahi kiya ja sakta; ye starting points hain. Inhi pe saara structure khada hai.','Both are accepted without proof — they are the starting bricks.']]},
 {q:'If A, B, C are three points on a line and B lies between A and C, prove that AB + BC = AC.',
  why:'"Whole = sum of parts" — segment addition. Ruler reading, distance calculation, har measurement me implicit hai.',
  steps:[
   ['Axiom: "If equals are added to equals, wholes are equal"','Ye Euclid ka Axiom 2 hai — additivity ka rule.','Use Euclid\'s axiom: wholes of equal parts are equal.'],
   ['AC = AB (with B between) → AC coincides with AB + BC','B ke beech hone se AB aur BC judd ke exactly AC bante hain — overlap nahi, coincidence (Axiom 4).','With B between A and C, the segments AB and BC together exactly match AC.'],
   ['Hence AB + BC = AC. QED','Isi logic se: agar AC = AB + BC, toh B neccessarily beech me hota hai (converse bhi true).','Therefore AB + BC = AC — and the converse holds too.']]}]}]};
BOOKZ.ang={src:'NCERT Class 9 · Lines and Angles — classic exam questions',sets:[{set:'NCERT Classic Exercises',qs:[
 {q:'Two complementary angles differ by 10°. Find both angles.',
  why:'Complementary = 90° ka jodi. Pipe fittings, roof slopes, TV mounts — right angles ke pieces har engineering me.',
  steps:[
   ['Let the angles be x and x + 10','Chhota x, bada x+10. Difference 10 diya hai.','Let the angles be x and x + 10.'],
   ['Sum = 90: x + (x + 10) = 90','Complementary angles ka sum 90° — equation ready.','x + (x + 10) = 90.'],
   ['2x = 80 → x = 40','Solve: x = 40. Angles: 40° and 50°.','2x + 10 = 90 → x = 40. The angles are 40° and 50°.'],
   ['Check: 40 + 50 = 90 ✓ and 50 − 40 = 10 ✓','Dono conditions satisfy.','Verified: sum 90°, difference 10°.']]},
 {q:'Two lines intersect. One of the angles formed is 35°. Find the other three.',
  why:'Scissors, road crossing, X sign — vertically opposite angles ka instant use.',
  steps:[
   ['Vertically opposite pair: 35° and 35°','Line cross pe opposite corners barabar hote hain (vertically opposite angles).','The angle vertically opposite 35° is also 35°.'],
   ['Linear pair: 35° + x = 180° → x = 145°','Same line ke adjacent angles ka sum 180° (linear pair).','The adjacent angle on the straight line: 180° − 35° = 145°.'],
   ['Fourth angle: 145° (vertical opposite again)','Bacha hua bhi 145° — opposite pair.','The remaining angle is 145°. So: 35°, 145°, 35°, 145°.']]},
 {q:'The angles of a triangle are in the ratio 2 : 3 : 4. Find all three angles.',
  why:'Angle sum property + ratio handling — exam me sabse zyada repeat hone wala combo.',
  steps:[
   ['Let angles = 2x, 3x, 4x','Ratio ko x me kholo.','Let the angles be 2x, 3x, 4x.'],
   ['Sum = 180: 2x + 3x + 4x = 180','Triangle ka golden rule: 180°.','Angle sum: 9x = 180.'],
   ['x = 20 → 40°, 60°, 80°','Solve aur substitute: 40, 60, 80.','x = 20 gives angles 40°, 60°, 80°.'],
   ['Check: 40 + 60 + 80 = 180 ✓','Verify always.','Sum checks out.']]},
 {q:'In the figure, PQ ∥ RS and a transversal cuts them. If one alternate interior angle is 65°, find the remaining angles on the diagram.',
  why:'Railway tracks + bridge girder — parallel lines aur transversal ka poora angle-map ek hi fact se khul jaata hai.',
  steps:[
   ['Alternate interior angles are EQUAL: partner = 65°','Z-pattern yaad karo: alternate interior pair barabar.','The alternate interior angle is also 65°.'],
   ['Corresponding angles EQUAL: the matching F-pattern angle = 65°','Same side matching position → 65°.','Corresponding angles are equal too: 65°.'],
   ['Linear pairs fill the rest: 180° − 65° = 115°','Baki positions linear pair se: 115°.','The remaining positions get 115° each (linear pair with 65°).'],
   ['Final map: four 65°, four 115°','Parallel + transversal ke 8 angles me sirf DO values hoti hain.','The 8 angles alternate between 65° and 115°.']]}]}]};
BOOKZ.tri={src:'NCERT Class 9 · Triangles — classic exam questions',sets:[{set:'NCERT Classic Exercises',qs:[
 {q:'In ∆ABC, AB = AC. Prove that ∠B = ∠C (base angles of an isosceles triangle).',
  why:'Isosceles ka property har proof, har design (roof trusses!) me. Ye NCERT ka first formal congruence proof hai.',
  steps:[
   ['Draw the angle bisector of ∠A meeting BC at D','Helper line: ∠A ka bisector. Ab do triangles ban gaye: ∆BAD aur ∆CAD.','Draw the bisector of ∠A, meeting BC at D.'],
   ['Compare ∆BAD and ∆CAD','AB = AC (given), ∠BAD = ∠CAD (construction), AD = AD (common).','In ∆BAD and ∆CAD: AB = AC, ∠BAD = ∠CAD, AD common.'],
   ['SAS congruence: ∆BAD ≅ ∆CAD','Do sides aur included angle barabar → SAS.','By SAS, ∆BAD ≅ ∆CAD.'],
   ['CPCT: ∠B = ∠C','Corresponding parts of congruent triangles — done!','By CPCT, ∠B = ∠C. Base angles are equal.']]},
 {q:'In an isosceles triangle, the vertex angle is 80°. Find the base angles.',
  why:'Same property, numeric form. Exam me 1-2 marks ka instant question.',
  steps:[
   ['Base angles are EQUAL (isosceles property)','Do barabar sides → do barabar base angles. Dono ko x bolo.','The two base angles are equal; call each x.'],
   ['x + x + 80 = 180','Angle sum: 180°.','x + x + 80 = 180.'],
   ['2x = 100 → x = 50°','Base angles 50°, 50°.','Each base angle is 50°.']]},
 {q:'Which congruence criterion proves two triangles congruent if two sides and the INCLUDED angle are equal? What about two angles and the included side?',
  why:'SAS/ASA/SSS/RHS — tool selection hi asli skill hai. Galat criterion likha toh proof invalid.',
  steps:[
   ['Two sides + included angle → SAS','Angle dono sides ke BEECH me ho toh SAS. (SSA nahi hota!)','Sides with the angle between them → SAS.'],
   ['Two angles + included side → ASA','Do angles aur unke beech ki side → ASA. (AAS bhi chalega logically.)','Two angles with the side between them → ASA.'],
   ['Right angle + hypotenuse + side → RHS','Right triangles ka special: RHS (Right angle-Hypotenuse-Side).','For right triangles: RHS.'],
   ['SSS: all three sides','Teeno sides barabar → SSS. Har triangle unique ban jaata hai.','All three sides equal → SSS.']]}]}]};
BOOKZ.quad={src:'NCERT Class 9 · Quadrilaterals — classic exam questions',sets:[{set:'NCERT Classic Exercises',qs:[
 {q:'The angles of a quadrilateral are in the ratio 3 : 5 : 9 : 13. Find all the angles.',
  why:'Quad ka angle sum 360° — rectangle/window/frame sab me. Ratio + sum = instant equation.',
  steps:[
   ['Let angles = 3x, 5x, 9x, 13x','Ratio ko x me kholo.','Let the angles be 3x, 5x, 9x, 13x.'],
   ['Sum = 360: 30x = 360','Quadrilateral ka angle sum 360°.','3x+5x+9x+13x = 30x = 360.'],
   ['x = 12 → 36°, 60°, 108°, 156°','Substitute x = 12.','Angles: 36°, 60°, 108°, 156°.'],
   ['Check: 36+60+108+156 = 360 ✓','Verify.','Sum checks.']]},
 {q:'One angle of a parallelogram is 70°. Find the other three angles.',
  why:'Doors, grids, escalators — parallelogram ke angle rules sab jagah. Adjacent supplementary, opposite equal.',
  steps:[
   ['Opposite angle = 70° (opposite angles equal)','Parallelogram me opposite angles barabar.','The opposite angle is also 70°.'],
   ['Adjacent angles are supplementary: 180 − 70 = 110°','Co-interior/adjacent pair ka sum 180°.','Each adjacent angle = 110°.'],
   ['Fourth = 110° (opposite pair again)','Doosra bhi 110°. Final: 70, 110, 70, 110.','So the angles are 70°, 110°, 70°, 110°.']]},
 {q:'In ∆PQR, L and M are the midpoints of PQ and PR. If QR = 14 cm, find LM.',
  why:'Midpoint theorem — triangle ke andar chhota parallel segment. Bridge trusses me load distribution isi pe.',
  steps:[
   ['Midpoint theorem: LM ∥ QR and LM = ½ QR','Do midpoints jodne wali segment third side ke parallel aur aadhi hoti hai.','By the Midpoint Theorem: LM ∥ QR and LM = QR/2.'],
   ['LM = 14/2 = 7 cm','Half of 14 = 7.','LM = 7 cm.'],
   ['Why? Extend LM to double it → congruent triangles (CPCT)','Proof idea: LM ko double karo, congruence se third point S pe QS ∥ PR nikalta hai — parallelogram ban jaata hai.','The proof doubles LM and uses congruence to form a parallelogram.']]}]}]};
BOOKZ.sol={src:'NCERT Class 9 · Surface Areas & Volumes — classic exam questions',sets:[{set:'NCERT Classic Exercises',qs:[
 {q:'The diameter of a cone is 10.5 cm and its slant height is 10 cm. Find its curved surface area.',
  why:'Birthday cap, ice-cream cone, traffic cone — CSA hi "wrapper" ka area hai. Material estimate karna industry me roz hota hai.',
  steps:[
   ['r = diameter/2 = 5.25 cm, l = 10 cm','Slant height l hai (tip se base edge tak) — height nahi!','Radius r = 5.25 cm, slant height l = 10 cm.'],
   ['CSA of cone = πrl','Formula: π × r × l.','CSA = πrl.'],
   ['= (22/7) × 5.25 × 10','5.25 × 22 = 115.5; ÷7 = 16.5; ×10 = 165.','(22/7)(5.25)(10) = 165.'],
   ['CSA = 165 cm²','Wrapper needs 165 cm² of material.','The curved surface area is 165 cm².']]},
 {q:'Find the surface area of a sphere of radius 7 cm.',
  why:'Footballs, globes, water tanks — sphere ka SA = 4πr². Ek formula, poora duniya ke gol cheezon ka budget.',
  steps:[
   ['SA of sphere = 4πr²','Poora surface — koi edge nahi, koi base nahi.','Surface area = 4πr².'],
   ['= 4 × (22/7) × 7²','7² = 49.','= 4 × (22/7) × 49.'],
   ['= 4 × 22 × 7 = 616 cm²','49/7 = 7 cancels beautifully.','SA = 616 cm².']]},
 {q:'A hemispherical brass bowl has inner diameter 10.5 cm. Find the cost of tin-plating its inside at ₹16 per 100 cm².',
  why:'Real-world cost problem — bowl, dome, jhoola cover. Area nikalo, rate lagao. (Hemisphere ka CSA = 2πr²!)',
  steps:[
   ['r = 10.5/2 = 5.25 cm; CSA hemisphere = 2πr²','Half sphere ka curved area = 2πr² (poore sphere ka aadha).','Inner radius 5.25 cm; curved area = 2πr².'],
   ['= 2 × (22/7) × 5.25² = 2 × (22/7) × 27.5625','5.25² = 27.5625.','Compute: 2 × (22/7) × 27.5625 = 173.25 cm².'],
   ['= 173.25 cm²','Plating area.','Area to plate: 173.25 cm².'],
   ['Cost = (173.25/100) × 16 = ₹27.72','Rate ₹16 per 100 cm² → 1.7325 × 16 = 27.72.','Cost = ₹27.72.']]}]}]};

/* ---------- LAB 21 · DICE CASINO ---------- */
LABS.dicecasino=function(box,ctl,opts,api){
 const mode=opts.mode||'die';
 const faces=mode==='coin'?2:6;
 const labels=mode==='coin'?['Heads','Tails']:['1','2','3','4','5','6'];
 const theo=1/faces;
 let counts=new Array(faces).fill(0),rolls=0;
 box.innerHTML='';const s=makeSVG(520,300);box.appendChild(s);
 const g=s.appendChild(NS('g',{}));
 const info=readout(ctl,'');
 function draw(){
  g.innerHTML='';
  const W=520,H=300,pad=46,bw=Math.min(56,(W-2*pad)/faces-14);
  const max=Math.max(5,...counts);
  // axes
  g.appendChild(LN(pad,H-40,W-pad,H-40,{stroke:'#3f3c58','stroke-width':2}));
  const thY=H-40-(theo)*(H-110)/ (max/rolls>theo?max:Math.max(1,max));
  // theoretical line position: count corresponding to theo proportion of rolls
  const thCount=rolls*theo;
  const thPix=H-40-(thCount/max)*(H-110);
  if(rolls>0)g.appendChild(LN(pad,thPix,W-pad,thPix,{stroke:'#C08A2D','stroke-width':2,'stroke-dasharray':'6 4'}));
  if(rolls>0)g.appendChild(T(W-24,thPix-8,'fair share '+(theo*100).toFixed(1)+'%',{'font-size':11,fill:'#C08A2D','text-anchor':'end','font-weight':800}));
  for(let i=0;i<faces;i++){
   const x=pad+(i+0.5)*((W-2*pad)/faces);
   const h=rolls? (counts[i]/max)*(H-110):0;
   g.appendChild(NS('rect',{x:x-bw/2,y:H-40-h,width:bw,height:Math.max(h,2),rx:6,fill:i%2?'#28517C':'#517DAB',opacity:.9}));
   g.appendChild(T(x,H-22,labels[i],{'font-size':12,fill:'#26243a','font-weight':800}));
   g.appendChild(T(x,H-48-h,String(counts[i]),{'font-size':12,fill:'#041D3D','font-weight':900}));
  }
  const emp=rolls?counts.reduce((a,c,i)=>Math.abs(c/rolls-theo)<Math.abs(a-theo)?c/rolls:0,0):0;
  let msg=rolls===0?'Roll karo! Bars = counts. Dashed gold line = the "fair share" every face SHOULD have.':
   'After '+rolls+' roll'+(rolls>1?'s':'')+': each bar vs the gold line. Long run me experimental ≈ theoretical (Law of Large Numbers).';
  if(rolls>=25)msg+=' Notice the gap shrinking as rolls grow — that is convergence!';
  info.innerHTML=msg;
  api.touch();
 }
 function roll(n){
  for(let k=0;k<n;k++){counts[R(1,faces)-1]++;rolls++}
  SFX.click();draw();
 }
 addBtn(ctl,'🎲 Roll 1','btn-s',()=>roll(1));
 addBtn(ctl,'⚡ Roll 25','btn-s',()=>roll(25));
 addBtn(ctl,'↺ Reset','btn-g',()=>{counts=new Array(faces).fill(0);rolls=0;draw()});
 if(mode==='coin')box.insertAdjacentHTML('afterbegin','<div style="text-align:center;font-weight:800;color:#5B4B8A">🪙 Coin Tally — heads vs tails</div>');
 draw();
};

/* ---------- LAB 22 · SEQUENCE MACHINE ---------- */
LABS.seqmachine=function(box,ctl,opts,api){
 box.innerHTML='';const s=makeSVG(520,300);box.appendChild(s);
 const g=s.appendChild(NS('g',{}));
 const info=readout(ctl,'');
 let kind=opts.kind||'AP';
 let a=2,d=3,r=2,n=8;
 function terms(){
  const out=[];
  for(let i=1;i<=10;i++)out.push(kind==='AP'? a+(i-1)*d : a*Math.pow(r,i-1));
  return out;
 }
 function draw(){
  g.innerHTML='';
  const t=terms(),W=520,H=300,pad=52;
  const mx=Math.max(...t);
  // baseline
  g.appendChild(LN(pad,H-52,W-30,H-52,{stroke:'#3f3c58','stroke-width':2}));
  const step=(W-30-pad)/10;
  t.forEach((v,i)=>{
   const x=pad+step*(i+0.5),y=H-52-(v/mx)*(H-130);
   const on=(i+1)===n;
   g.appendChild(CR(x,y,on?15:9,{fill:on?'#E3AF3C':(kind==='AP'?'#28517C':'#1F6B54'),opacity:on?1:.85,stroke:on?'#7A5A12':'none','stroke-width':2}));
   g.appendChild(T(x,H-36,'t'+(i+1),{'font-size':11,fill:'#517DAB','font-weight':700}));
   g.appendChild(T(x,y-22,on?String(v):'',{'font-size':14,fill:'#7A5A12','font-weight':900}));
  });
  const formula=kind==='AP'? ('tn = '+a+' + (n−1)×'+d+' = '+a+' + '+(a-0)+'+(n−1)·'+d) : ('tn = '+a+'×'+r+'^(n−1)');
  const val=kind==='AP'? a+(n-1)*d : a*Math.pow(r,n-1);
  g.appendChild(T(W/2,34,kind+' · t'+n+' = '+val,{'font-size':16,fill:'#041D3D','font-weight':900}));
  g.appendChild(T(W/2,56,formula,{'font-size':12.5,fill:'#517DAB','font-weight':700}));
  info.innerHTML=(kind==='AP'? 'AP: har term me '+d+' JUDD raha hai (constant difference). Growth seedhi line me.':'GP: har term ko '+r+' se MULTIPLY ho raha hai (constant ratio). Growth curve me — explosion!');
  api.touch();
 }
 addTabs(ctl,['AP · adding','GP · multiplying'],0,i=>{kind=i===0?'AP':'GP';draw()});
 addSlider(ctl,'first term a',1,10,a,1,v=>{a=v;draw()});
 if(true)addSlider(ctl,'step d (AP)',1,9,d,1,v=>{d=v;draw()});
 addSlider(ctl,'ratio r (GP)',2,4,r,1,v=>{r=v;draw()});
 addSlider(ctl,'pick term n',1,10,n,1,v=>{n=v;draw()});
 draw();
};

     return Q('In the AP with first term '+a0+' and common difference '+d0+', the '+n+'th term is…',String(a0+(n-1)*d0),[String(a0+n*d0),String(a0+(n-2)*d0),String(a0+(n-1)*(d0+1))],'t'+n+' = a + (n−1)d = '+a0+' + '+(n-1)+'×'+d0+' = '+(a0+(n-1)*d0)+'.','t_n = a + (n−1)d — (n−1) jumps of size d.');
    }
    const a0=R(2,8),d0=R(2,6),target=a0+R(5,12)*d0;
    const n=(target-a0)/d0+1;
    return Q('Which term of the AP '+a0+', '+(a0+d0)+', '+(a0+2*d0)+', … is '+target+'?','t'+n,['t'+(n+1),'t'+(n-1),'t'+(n+2)],'Solve a + (n−1)d = '+target+': (n−1) = ('+(target)+'−'+a0+')/'+d0+' = '+(n-1)+' → n = '+n+'.','Set tn = target and solve for n.');
   }},
  {id:'seq3',t:'Geometric Progressions',sub:'a, r, and tn = a·r^(n−1)',
   irl:['Bacteria doubling (book ka example): 30 → 60 → 120 → … = 30·2ⁿ','Population growth, compound interest, viral video shares, Sierpiński fractal triangles — multiply-style growth = GP'],
   hook:{ic:'🦠',s:'Science lab: 30 bacteria rakh diye. Ek ghante me DOUBLE — 60. Phir 120, 240… Do din baad teacher ne whiteboard pe likha: 30 × 2⁴⁸. Class hansi, phir chup — number itna BADA tha ki poore earth se zyada! "Yehi hai multiplying power," teacher boli. "Adding linear hai, multiplying EXPONENTIAL."',
         w:'GP = constant MULTIPLY wala pattern (ratio r). Doubling, halving, tripling — GP hi hai. Fractals aur finance dono yahin milte hain.'},
   facts:[['GP = constant ratio r','Har term ko pichle se MULTIPLY kiya gaya. r = t2/t1 = t3/t2 (do ratios check karo).'],
          ['tn = a·r^(n−1)','a = first term, r = multiplier. t8 = a·r⁷ — seven jumps of multiplication.'],
          ['r = 2 → doubling explosion','2ⁿ bahut tez badhta hai: 2¹⁰ ≈ 1000, 2²⁰ ≈ 10 lakh, 2³⁰ = 100 crore ke aas paas!'],
          ['r < 1 → shrinking GP','Bounce ball 60% tak hi uthta hai: heights 80, 48, 28.8… — GP with r = 0.6. Area of fractal also SHRINKS.']],
   lab:['seqmachine',{kind:'GP'}],
   tasks:['Set a = 3, r = 2 and watch t10 (multiply, don\'t add!)','Compare AP d = 2 vs GP r = 2 at t8 — kiski value zyada?'],
   ex:{t:'The bacteria count starts at 30 and doubles every hour. Find the count after 2 h, 4 h and n hours.',
       steps:[['It\'s a GP: 30, 60, 120, … with r = 2','Doubling = ×2 each hour — geometric progression.','Counts form a GP with first term 30 and ratio 2.'],
              ['2 h: 30 × 2² = 120','Do doublings: ×4.','After 2 hours: 120.'],
              ['4 h: 30 × 2⁴ = 480','Chaar doublings: ×16.','After 4 hours: 480.'],
              ['n h: 30 × 2ⁿ','General: after n hours, n multiplications of 2 → 30·2ⁿ.','After n hours: 30·2ⁿ.']]},
   gen(){
    const t=R(1,3);
    if(t===1){
     const a0=pick([2,3,5]),r0=pick([2,3]);
     return Q('Find the next term of the GP: '+a0+', '+(a0*r0)+', '+(a0*r0*r0)+', …',String(a0*r0*r0*r0),[String(a0*r0*r0+r0),String(a0*r0*r0*r0*r0),String(a0*r0*r0+ a0*r0)],'Ratio = '+r0+' (constant). Multiply: '+(a0*r0*r0)+' × '+r0+' = '+(a0*r0*r0*r0)+'.','Divide consecutive terms to find r, then multiply again.');

     return Q('Bacteria double every hour, starting from 50. After 3 hours the count is…','400',['150','200','350'],'GP: 50 × 2³ = 400.','50·2ⁿ after n hours.');
    }

   }}

function bookListHTML(wid){

 +bk.sets.map(st=>'<div class="bset">'+st.set+'</div>'
  +st.qs.map((q,qi)=>{
   const gi=bk.sets.slice(0,bk.sets.indexOf(st)).reduce((a,s2)=>a+s2.qs.length,0)+qi;

 +(done?'<p class="muted" style="margin-top:10px;font-size:12.5px">✅ You have solved '+done+' of these, Warrior. Re-solving is free — revision is a weapon.</p>':'');

 const w=worldById(wid),bk=BOOKZ[wid];if(!w||!bk){go('home');return}
 let gi=0,q=null,set=null;
 for(const st of bk.sets){for(const qq of st.qs){if(gi===qi){q=qq;set=st;break}gi++}}

 BQ={wid,qi,rev:(BQ&&BQ.wid===wid&&BQ.qi===qi)?BQ.rev:0,q,set};

 +'<span class="bsetchip">'+set.set+'</span>'

 +(q.why?'<div class="bwhy"><b>💡 Why it matters:</b> '+q.why+'</div>':'')
 +'<div class="bsteps">'+steps.slice(0,BQ.rev).map((s,i)=>stepHTML(s,i)).join('')+'</div>'

 +'<div class="backrow"><button class="btn btn-g btn-sm" onclick="A.book(\''+wid+'\')">← Book Zone</button><span class="muted" style="font-size:12.5px">'+w.n+'</span></div>'
 +body+'</div>';

window.A={
 home(){QSTATE=null;go('home')},
 world(id){QSTATE=null;go('world',{wid:id})},
 lesson(wid,cid){go('lesson',{wid,cid,step:0})},
 setStep(wid,cid,step){go('lesson',{wid,cid,step})},
 practice(wid,cid){go('quiz',{wid,cid,mode:'practice'})},
 sound(){S.sound=!S.sound;save();renderTopbar();if(S.sound)SFX.click()},
 ovlClose(){closeOvl()},
 closeCov(){closeOvl()},
 startRandom(){const w=pick(WORLDS);go('world',{wid:w.id})},
 exploreDone(cid){
  if(!S.labdone[cid]){S.labdone[cid]=true;save();addXP(8,'lab explored')}

 },
 hint(){const h=$('#qhint');if(h)h.classList.add('show')},
 exNext(wid,cid){

  if(EXSTATE[cid]>=c.ex.steps.length&&!S.exdone[cid]){S.exdone[cid]=true;save();addXP(6,'example solved')}
  SFX.step();
  renderLesson(wid,cid,3);
 },
 /* quiz answer (page mode) */
 answer(i){
  if(!QSTATE||QSTATE.answered)return;
  const q=QSTATE.qs[QSTATE.idx];
  const btns=[0,1,2,3].map(k=>$('#opt'+k));
  btns.forEach(b=>b&&b.setAttribute('disabled','1'));
  const ok=i===q.a;
  if(ok){
   btns[i].classList.add('correct');
   const r=btns[i].getBoundingClientRect();burst(24,r.left+r.width/2,r.top);
   SFX.ok();
   if(QSTATE.firstTry){QSTATE.score++;addXP(6,'correct')}
  }else{
   btns[i].classList.add('wrong');btns[q.a].classList.add('correct');
   btns.forEach((b,k)=>{if(k!==i&&k!==q.a)b.classList.add('dim')});
   SFX.no();
  }
  QSTATE.results[QSTATE.idx]=ok;QSTATE.answered=true;
  $('#whybox').innerHTML='<div class="why"><b>'+(ok?'✅ Correct!':'❌ Not this one.')+'</b>'+q.why+'</div>';
  $('#nextslot').innerHTML='<button class="btn btn-p btn-sm" onclick="A.qNext()">'+(QSTATE.idx<QSTATE.qs.length-1?'Next →':'Finish')+'</button>';
  const dots=document.querySelectorAll('.qdot');dots.forEach((d,k)=>{d.className='qdot'+(QSTATE.results[k]===undefined?(k===QSTATE.idx?' cur':''):(QSTATE.results[k]?' ok':' no'))});
 },
 qNext(){
  if(!QSTATE)return;
  if(QSTATE.idx<QSTATE.qs.length-1){QSTATE.idx++;QSTATE.firstTry=true;QSTATE.answered=false;rerenderQuiz()}
  else endPractice();
 },
 /* boss answer */
 banswer(i){
  if(!BOS||BOS.answered)return;BOS.answered=true;
  const q=BOS.qs[BOS.idx];
  const btns=[0,1,2,3].map(k=>$('#opt'+k));
  btns.forEach(b=>b&&b.setAttribute('disabled','1'));
  const ok=i===q.a;
  if(ok){
   btns[i].classList.add('correct');BOS.score++;BOS.hp=Math.max(0,BOS.hp-20);
   const hf=$('#hpfill');if(hf)hf.style.width=BOS.hp+'%';
   const hn=$('#hpnum');if(hn)hn.textContent=BOS.hp+'/100';
   bossStrike();SFX.hit();addXP(4,'boss strike');
  }else{
   btns[i].classList.add('wrong');btns[q.a].classList.add('correct');
   btns.forEach((b,k)=>{if(k!==i&&k!==q.a)b.classList.add('dim')});
   SFX.no();
   const ar=$('#arena');if(ar){ar.classList.add('shake');setTimeout(()=>ar.classList.remove('shake'),450)}
  }
  $('#bwhy').innerHTML='<div class="why"><b>'+(ok?'⚔️ STRIKE! The boss reels!':'💥 The boss counters!')+'</b>'+q.why+'</div>';
  setTimeout(()=>{
   if(BOS.idx<BOS.qs.length-1){BOS.idx++;renderBoss()}
   else bossEnd();
  },ok?900:1400);
 },
 bossIntro(wid){

  +'<p style="margin-top:12px">“'+w.boss.taunt+'”</p>'
  +'<div class="steps3"><div><b>5</b><span>questions drawn from every concept of '+w.n+'</span></div><div><b>4+</b><span>correct answers to claim the throne (+80 XP)</span></div><div><b>5/5</b><span>= FLAWLESS bonus (+40 XP)</span></div></div>'
  +'<div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-gold btn-xl" onclick="A.bossStart(\''+wid+'\')">⚔️ START BATTLE</button><button class="btn btn-sm" style="background:rgba(255,255,255,.1);color:#fff" onclick="A.ovlClose()">Not yet</button></div>'
  +'</div>',true);
 },

 bossAgain(){const wid=BOS?BOS.wid:ROUTE.wid;const a=$('#arena');if(a)a.remove();BOS=null;startBoss(wid)},

 },

 const pass=QSTATE.score>=4;
 if(QSTATE.mode==='lesson'){
  if(pass){
   const first=!S.covered[c.id];
   S.covered[c.id]=true;save();
   if(first)addXP(30,'concept covered');
   coveredOverlay(c,first?'+'+ (30) +' XP bonus · concept permanently covered!':'Already covered before — practice XP banked!');
  }else{
   showOvl('<div class="introcard"><div class="big">💪</div><h2>So close, Warrior!</h2><p>You scored '+QSTATE.score+'/5. You need 4 to cover this concept. Revisit the lab, then come back — nothing is locked, ever.</p><div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="btn btn-gold" onclick="A.setStep(\''+QSTATE.wid+'\',\''+QSTATE.cid+'\',4)">🔁 Try fresh questions</button><button class="btn btn-sm" style="background:rgba(255,255,255,.1);color:#fff" onclick="A.setStep(\''+QSTATE.wid+'\',\''+QSTATE.cid+'\',2)">Back to lab</button></div></div>',true);
  }
 }else{
  if(pass){
   const first=!S.covered[c.id];
   S.covered[c.id]=true;save();
   if(first)addXP(30,'concept covered');
   coveredOverlay(c,first?'+30 XP bonus · '+c.sub:'Practice score '+QSTATE.score+'/5 — banked!');
  }else{
   showOvl('<div class="introcard"><div class="big">🎯</div><h2>Score '+QSTATE.score+'/5</h2><p>You need 4+ to cover <b>'+c.t+'</b>. The explanations you just read ARE the lesson — one more round and it is yours.</p><div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="btn btn-gold" onclick="A.practice(\''+QSTATE.wid+'\',\''+QSTATE.cid+'\');A.ovlClose()">🔁 Fresh questions</button><button class="btn btn-sm" style="background:rgba(255,255,255,.1);color:#fff" onclick="A.world(\''+QSTATE.wid+'\');A.ovlClose()">Back to world</button></div></div>',true);
  }
 }
}

/* ---------- quiz page shell ---------- */
function renderQuiz(){
 const w=worldById(ROUTE.wid),c=w?w.concepts.find(x=>x.id===ROUTE.cid):null;
 if(!c){go('home');return}
 QSTATE={wid:ROUTE.wid,cid:ROUTE.cid,mode:'practice',idx:0,score:0,results:[],firstTry:true};
 QSTATE.qs=genQs(c,5);
 App.innerHTML='<div class="screen wrap" style="max-width:760px">'
 +'<div class="les-head"><div class="crumbs"><button class="btn btn-g btn-sm" onclick="A.world(\''+ROUTE.wid+'\')">← '+w.n+'</button><span>/</span><b>'+c.t+'</b></div>'
 +'<h1 class="les-t">🎯 Practice: '+c.t+'</h1><div class="les-sub">5 fresh exam-style questions · 4 correct = concept covered · wrong answers teach, not punish</div></div>'
 +'<div id="quizzone">'+quizCard()+'</div></div>';
}

/* ---------- boot ---------- */
function boot(){
 render();
 if(!S.seen){
  showOvl('<div class="introcard"><div style="width:92px;height:92px;margin:0 auto 10px;background:#fff;border-radius:24px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)"><img src="'+LOGO_MARK+'" style="width:70px;height:70px;object-fit:contain" alt="VidhyaSaathy"></div>'
  +'<div style="font-size:10.5px;letter-spacing:.22em;color:#F2D57E;font-weight:800;margin-bottom:4px">VIDHYASAATHY PRESENTS</div>'
  +'<h2>Welcome to MATHS WAR</h2>'
  +'<p>I am your <b>Warrior</b>-coach. This arena covers your full Grade 9 syllabus — '+WORLDS.length+' worlds, '+WORLDS.reduce((a,w)=>a+w.concepts.length,0)+' concepts, your actual Ganita Manjari textbook solved step-by-step — and every single one is unlocked from the first second.</p>'
  +'<div class="steps3"><div><b>1</b><span>📖 LEARN — story → key facts → real-world uses → living diagrams → worked example</span></div><div><b>2</b><span>🎯 PRACTICE — fresh exam-style questions every time; explanations teach, nothing punishes</span></div><div><b>3</b><span>👑 BOSSES — beat each world\'s monster to claim the throne. 4/5 wins the fight</span></div></div>'
  +'<button class="btn btn-gold btn-xl" onclick="A.introDone()">⚔️ Enter the arena</button>'
  +'</div>',true);
 }
}
boot();
