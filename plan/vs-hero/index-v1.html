<!doctype html><html lang="en"><head><meta charset="utf-8"><title>VidhyaSaathy</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--navy:#13224A;--ivory:#FFF8EE;--sky:#7FB3FF;--peach:#FFB38A;--ink:#13224A;--muted:#3E4A6B}
*{box-sizing:border-box;margin:0}
body{font-family:'Patrick Hand',cursive;background:var(--ivory);color:var(--ink);font-size:20px;overflow-x:hidden}
nav{display:flex;align-items:center;gap:40px;padding:22px 6vw;position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:10px;font-size:28px;color:var(--navy);text-decoration:none}
.brand img{width:40px;height:40px;object-fit:contain}
.links{display:flex;gap:30px;margin-left:56px}
.links a{color:var(--navy);text-decoration:none;font-size:20px}
.reg{margin-left:auto;background:var(--peach);color:var(--navy);padding:9px 20px;border-radius:6px;text-decoration:none;font-size:20px;border:2px solid var(--navy)}
.hero{position:relative;height:calc(100vh - 88px);min-height:640px;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;padding:0 6vw 40px}
.night{position:absolute;right:0;top:0;bottom:0;width:30vw;border-top-left-radius:2px;background:var(--navy);z-index:0}
.night i{position:absolute;width:3px;height:3px;background:var(--ivory);border-radius:50%}
.copy{position:relative;z-index:2;max-width:560px;margin-top:-30px}
.time{font-size:20px;color:var(--muted);margin-bottom:18px}
h1{font-weight:400;font-size:clamp(60px,6.2vw,88px);line-height:.98;letter-spacing:-.5px}
.bell{position:relative;white-space:nowrap}
.bell svg{position:absolute;left:-6px;bottom:-14px;width:calc(100% + 16px);height:22px}
.sub{font-size:25px;line-height:1.35;margin:30px 0 36px;color:var(--muted);max-width:430px}
.ctas{display:flex;align-items:center;gap:30px}
.btn{background:var(--navy);color:var(--ivory);padding:14px 28px;border-radius:6px;text-decoration:none;font-size:23px;box-shadow:3px 3px 0 var(--sky)}
.tl{color:var(--navy);font-size:22px;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px}
.art{position:relative;z-index:1;height:620px}
.path{position:absolute;left:-60px;top:20px;width:430px;height:520px}
.phone{z-index:1;position:absolute;right:13vw;top:30px;width:270px;padding:10px;background:#0E1938;border-radius:34px;transform:rotate(4deg);
 box-shadow:0 1px 1px rgba(19,34,74,.25),0 18px 30px -12px rgba(19,34,74,.45),14px 26px 0 -14px rgba(19,34,74,.12)}
.phone img{display:block;width:100%;height:500px;object-fit:cover;object-position:top;border-radius:25px}
.mascot{position:absolute;right:calc(13vw + 228px);top:330px;width:165px;transform:rotate(-10deg);z-index:0}
.note{position:absolute;left:-70px;top:530px;font-size:27px;transform:rotate(-5deg);color:var(--navy)}
.note svg{position:absolute;left:70px;top:-92px;width:80px;height:90px;z-index:3;overflow:visible}
.moon{position:absolute;right:4vw;top:20px;color:var(--ivory);font-size:20px;transform:rotate(3deg);text-align:right;z-index:2}
</style></head><body>
<nav><a class="brand" href="#"><img src="logo.png" alt="">VidhyaSaathy</a>
<div class="links"><a href="#">How it works</a><a href="#">For parents</a><a href="#">Safety</a></div>
<a class="reg" href="#">Register your school</a></nav>
<section class="hero">
 <div class="night"><i style="left:22%;top:30%"></i><i style="left:70%;top:22%"></i><i style="left:48%;top:61%"></i><i style="left:82%;top:76%"></i><i style="left:15%;top:84%"></i></div>
 <div class="copy">
  <p class="time">3:40 pm, school's out.</p>
  <h1>Learning doesn't stop at the <span class="bell">bell.<svg viewBox="0 0 200 22" preserveAspectRatio="none"><path d="M3 14 C 30 8, 62 17, 95 11 S 160 6, 196 12 M14 18 C 60 14, 120 19, 170 15" fill="none" stroke="#FFB38A" stroke-width="4.5" stroke-linecap="round"/></svg></span></h1>
  <p class="sub">Your school's notes, practice and Saathy, every evening.</p>
  <div class="ctas"><a class="btn" href="#">See how it works</a><a class="tl" href="#">Register your school</a></div>
 </div>
 <div class="art">
  <svg class="path" viewBox="0 0 430 520"><path d="M10 500 C 80 420, 40 330, 140 300 S 250 180, 330 120 S 410 40, 425 10" fill="none" stroke="#7FB3FF" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/></svg>
  <div class="phone"><img src="chat.jpg" alt="Saathy chat explaining the Cartesian plane"></div>
  <img class="mascot" src="mascot.png" alt="Saathy, the cloud mascot">
  <div class="note">this is Saathy<svg viewBox="0 0 90 70"><path d="M8 64 C 2 44, 18 24, 44 8 M44 8 L30 8 M44 8 L40 22" fill="none" stroke="#13224A" stroke-width="2.6" stroke-linecap="round"/></svg></div>
  <p class="moon">9:00 pm<br>still here.</p>
 </div>
</section></body></html>
